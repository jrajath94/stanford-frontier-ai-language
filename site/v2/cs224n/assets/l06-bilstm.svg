<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Bidirectional and stacked RNNs</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Bidirectional: read both ways, concatenate</text><rect x="60" y="100" width="300" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">left to right</text><text x="210" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">forward hidden</text><rect x="400" y="100" width="300" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">right to left</text><text x="550" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">backward hidden</text><line x1="360" y1="130" x2="400" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="400,130 391,126 391,134" fill="#5A5A52"/><rect x="230" y="200" width="300" height="50" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="380" y="231" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">concatenate both</text><text x="60" y="280" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Stacked RNNs: layers of cells, deeper memory.</text></svg>