<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l04-flashattention" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-flashattention" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">FlashAttention: respect the memory hierarchy</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. Stanford, 2022. ~10x fewer HBM accesses. Exact, not approximate.</text>
<rect x="60" y="130" width="400" height="200" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">HBM</text>
<text x="260" y="194.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">big, slow</text>
<text x="260" y="214.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">all of Q, K, V live here</text>
<rect x="500" y="130" width="400" height="200" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">SRAM</text>
<text x="700" y="194.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">small, fast</text>
<text x="700" y="214.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">on-chip, per block</text>
<line x1="460" y1="230" x2="500" y2="230" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l04-flashattention)"/>
<rect x="453.1" y="218.9" width="53.7" height="22.1" rx="8" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/>
<text x="480.0" y="230.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" dominant-baseline="middle">tiles</text>
<text x="60" y="370.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">1. Load a tile of Q, K, V to SRAM.</text>
<text x="480" y="370.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">2. Block softmax trick: running max + sum, no full matrix.</text>
<text x="60" y="426.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">3. Write the output tile back.</text>
<text x="480" y="426.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">4. Recompute, do not store: extra math beats extra memory trips.</text>
<rect x="60" y="510" width="840" height="70" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="545.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Insight: memory moves dominate. Recomputing is cheaper than re-reading.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>