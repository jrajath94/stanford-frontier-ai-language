<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l03-kv-paged" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l03-kv-paged" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">KV cache and PagedAttention</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 3. Cache keys and values. Page them like OS memory.</text>
<text x="24" y="120.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Without cache: recompute all K, V every step. With cache: append one row.</text>
<rect x="60" y="160" width="60" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="90" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t1</text>
<rect x="130" y="160" width="60" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t2</text>
<rect x="200" y="160" width="60" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="230" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t3</text>
<rect x="270" y="160" width="60" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="300" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t4</text>
<rect x="340" y="160" width="60" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="370" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t5</text>
<rect x="410" y="160" width="60" height="90" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="440" y="205.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="450" fill="#1B2838" dominant-baseline="middle">t6</text>
<text x="540" y="205.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">+ new token</text>
<rect x="60" y="300" width="400" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="336.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">PagedAttention (vLLM)</text>
<text x="260" y="365.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Split cache into blocks</text>
<text x="260" y="383.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">(block size ~16 [uncertain]).</text>
<text x="260" y="430.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">Kills fragmentation.</text>
<rect x="500" y="300" width="400" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="336.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">MLA (DeepSeek V2)</text>
<text x="700" y="365.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Compress K, V into</text>
<text x="700" y="383.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">latent vectors.</text>
<text x="700" y="430.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">Less memory per token.</text>
<rect x="60" y="510" width="840" height="70" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="545.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Decoding is memory-bound: moving the cache costs more than the math.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>