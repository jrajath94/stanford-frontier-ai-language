<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Thompson sampling</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Sample a plausible world, then act optimally in it.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="280" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">1. belief</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">posterior over</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">arm means</text><rect x="400" y="170" width="280" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="400" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="424" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">2. sample</text><text x="424" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">draw one world</text><text x="424" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">mu_tilde ~ posterior</text><rect x="740" y="170" width="280" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="740" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="764" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">3. act</text><text x="764" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">pull argmax</text><text x="764" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">mu_tilde</text><line x1="340" y1="265" x2="400" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M400,265 l-11,-4.5 M400,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><line x1="680" y1="265" x2="740" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M740,265 l-11,-4.5 M740,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="60" y="400" width="1000" height="110" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="432" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Uncertain arms get sampled optimistically sometimes: exploration emerges from the posterior.</text><text x="84" y="460" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Dates to 1933 (clinical trials). Rediscovered in the 2010s for ads and recommendations.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 3.3 historical note, original plate. Shell 3: the three steps.</text></svg>