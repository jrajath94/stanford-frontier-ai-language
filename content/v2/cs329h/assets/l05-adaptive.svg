<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The adaptive elicitation loop</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Each answer sharpens the next question.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="200" width="220" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="200" width="8" height="150" rx="4" fill="#1E4D8C"/><text x="84" y="232" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">estimate</text><text x="84" y="258" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">current Uhat</text><line x1="280" y1="275" x2="340" y2="275" stroke="#1E4D8C" stroke-width="1.5"/><path d="M340,275 l-11,-4.5 M340,275 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="340" y="200" width="220" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="340" y="200" width="8" height="150" rx="4" fill="#1F7A72"/><text x="364" y="232" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">select</text><text x="364" y="258" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">max Fisher info</text><line x1="560" y1="275" x2="620" y2="275" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,275 l-11,-4.5 M620,275 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="620" y="200" width="220" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="200" width="8" height="150" rx="4" fill="#C46B2C"/><text x="644" y="232" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">ask</text><text x="644" y="258" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">one comparison</text><line x1="840" y1="275" x2="900" y2="275" stroke="#1E4D8C" stroke-width="1.5"/><path d="M900,275 l-11,-4.5 M900,275 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="900" y="200" width="220" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="900" y="200" width="8" height="150" rx="4" fill="#1E4D8C"/><text x="924" y="232" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">update</text><text x="924" y="258" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">new Uhat</text><line x1="60" y1="400" x2="60" y2="350" stroke="#1E4D8C" stroke-width="1.5"/><path d="M60,350 l-11,-4.5 M60,350 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><text x="100" y="410" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">repeat until the budget runs out</text><text x="60" y="470" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Active learning spends the question budget where it cuts uncertainty fastest.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 2.17-2.20, original plate. Shell 2: the loop.</text></svg>