<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Training compute versus global capacity</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Largest-model compute is not sustainable</text><text x="60" y="100" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="start" font-weight="normal">largest-model training compute (red)</text><text x="60" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="start" font-weight="normal">global compute capacity (blue)</text><line x1="60" y1="200" x2="700" y2="200" stroke="#5A5A52" stroke-width="2"/><line x1="60" y1="200" x2="700" y2="120" stroke="#D96830" stroke-width="4"/><line x1="60" y1="200" x2="700" y2="160" stroke="#2E6BE6" stroke-width="4"/><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Training demand outruns capacity. Concentration follows:</text><text x="60" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">few organizations can train frontier models.</text></svg>