<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Pretraining reconstructs the input</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Pretraining: reconstruct the input</text><rect x="60" y="90" width="640" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="normal">Stanford University is located in [MASK] Alto</text><line x1="380" y1="150" x2="380" y2="190" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,190 371,186 371,194" fill="#2B2B2B"/><rect x="230" y="190" width="300" height="50" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="221" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">predict: Palo</text><text x="60" y="280" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Mask part of the input. Predict it back. Trillions of words, no labels.</text></svg>