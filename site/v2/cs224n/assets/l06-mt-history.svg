<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Machine translation history</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">MT: rules, then statistics, then neural</text><rect x="40" y="90" width="220" height="100" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="150" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">1950s</text><text x="150" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">rule-based</text><text x="150" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">hand-written</text><line x1="260" y1="140" x2="300" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="300,140 291,136 291,144" fill="#5A5A52"/><rect x="280" y="90" width="220" height="100" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="390" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">1990s-2010s</text><text x="390" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">phrase-based</text><text x="390" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">never really worked great</text><line x1="500" y1="140" x2="540" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="540,140 531,136 531,144" fill="#5A5A52"/><rect x="520" y="90" width="220" height="100" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="630" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">2014</text><text x="630" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">neural MT</text><text x="630" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">seq2seq breakthrough</text><line x1="740" y1="140" x2="780" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="780,140 771,136 771,144" fill="#5A5A52"/><text x="40" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">&#x27;Where NLP started.&#x27; 2014: two LSTMs beat decades of engineering.</text></svg>