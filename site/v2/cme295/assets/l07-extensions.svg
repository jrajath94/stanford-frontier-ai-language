<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l07-extensions" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-extensions" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">RAG extensions: three upgrades</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. HyDE, contextual retrieval, prompt caching.</text>
<rect x="60" y="110" width="240" height="134" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="177.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">HyDE</text>
<text x="340" y="160.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">LLM writes a fake answer doc, embed that</text>
<text x="340" y="194.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">query and docs finally look alike</text>
<rect x="60" y="260" width="240" height="134" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="327.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Contextual retrieval</text>
<text x="340" y="310.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">LLM writes a short context per chunk</text>
<text x="340" y="344.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">chunks make sense alone</text>
<rect x="60" y="410" width="240" height="134" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="477.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Prompt caching</text>
<text x="340" y="460.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">same prefix computed once</text>
<text x="340" y="494.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~1/10 price on cached tokens</text>
<rect x="60" y="540" width="840" height="56" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="568.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">All three trade extra LLM calls for better retrieval. Cache the repeated prefixes.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>