<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<defs><marker id="ah-l07-toolcall" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-toolcall" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="680" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Tool calling: three stages</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. IBM definition: complete tasks via external resources.</text>
<rect x="60" y="120" width="840" height="100" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">"Find a teddy bear near me."</text>
<text x="480" y="190.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">The model sees the API + docstring. Not the implementation.</text>
<rect x="60" y="270" width="240" height="190" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="310.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">1. Predict</text>
<text x="180" y="351.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">query + API -&gt; arguments</text>
<text x="180" y="369.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">find_teddy_bear(loc=Stanford)</text>
<line x1="300" y1="365" x2="340" y2="365" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-toolcall)"/>
<rect x="340" y="270" width="240" height="190" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="460" y="310.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">2. Execute</text>
<text x="460" y="351.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">run the function</text>
<text x="460" y="369.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">(no LLM involved)</text>
<line x1="580" y1="365" x2="620" y2="365" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-toolcall)"/>
<rect x="620" y="270" width="240" height="190" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="740" y="310.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">3. Respond</text>
<text x="740" y="351.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">structured result -&gt;</text>
<text x="740" y="369.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">natural language answer</text>
<rect x="60" y="520" width="840" height="100" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="556.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Train with 2 SFT pair types: tool prediction, and history-to-final-answer.</text>
<text x="480" y="590.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Or skip SFT: strong models follow a well-written explanation, tuned offline on an eval set.</text>
<text x="944" y="666" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>