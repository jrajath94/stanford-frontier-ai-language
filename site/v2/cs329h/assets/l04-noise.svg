<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Label noise: random vs systematic</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Random noise blurs. Systematic noise lies.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="460" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">random noise (10%)</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">labels flipped at random</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">utilities shrink toward 0</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">ranking preserved</text><text x="84" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fix: more data</text><rect x="600" y="170" width="460" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="624" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">systematic noise</text><text x="624" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">annotators prefer verbosity</text><text x="624" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">MLE learns the bias</text><text x="624" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">ranking can REVERSE</text><text x="624" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fix: model the bias</text><text x="60" y="410" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">The textbook's 10% uniform noise is the kind case. Real pipelines have position bias, verbosity bias, satisficing.</text><text x="60" y="438" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">This is the inversion problem in miniature: observed choices may not reflect true preferences.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 2.9 callout, original plate. Shell 4: the two noises.</text></svg>