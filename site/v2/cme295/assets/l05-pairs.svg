<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l05-pairs" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l05-pairs" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Preference pairs: the washer example</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 5. Pairwise is the standard. Pointwise and listwise exist.</text>
<rect x="60" y="120" width="840" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">Prompt: my washer is broken, what do I do?</text>
<text x="480" y="192.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Two answers. A human picks the better one.</text>
<rect x="60" y="260" width="400" height="170" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="296.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#C46B2C" dominant-baseline="middle">Rejected</text>
<text x="260" y="327.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Factually correct</text>
<text x="260" y="345.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">but rough and blunt.</text>
<rect x="500" y="260" width="400" height="170" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="296.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1F7A72" dominant-baseline="middle">Chosen</text>
<text x="700" y="327.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Same facts.</text>
<text x="700" y="345.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Gentler, clearer, safer.</text>
<line x1="460" y1="345" x2="500" y2="345" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l05-pairs)"/>
<rect x="449.4" y="333.9" width="61.2" height="22.1" rx="8" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/>
<text x="480.0" y="345.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" dominant-baseline="middle">prefer</text>
<rect x="60" y="480" width="840" height="80" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="520.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Pairs come from human logs or rewrites. Binary choice keeps annotation simple.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>