<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">IIA: the ratio ignores the rest</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Add a third option. The relative odds of j vs k do not move.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="440" height="180" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="180" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">choice set {j, k}</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p(j)/p(k) = e^Vj / e^Vk</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">ratio depends only</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">on Vj - Vk</text><rect x="620" y="170" width="440" height="180" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="170" width="8" height="180" rx="4" fill="#1E4D8C"/><text x="644" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">choice set {j, k, l}</text><text x="644" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p(j)/p(k) = e^Vj / e^Vk</text><text x="644" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">same ratio</text><text x="644" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">l cancels out</text><line x1="500" y1="260" x2="620" y2="260" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,260 l-11,-4.5 M620,260 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="247.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="265.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">add l</text><rect x="60" y="390" width="1000" height="90" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="422" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">The payoff: the full M! - 1 preference distribution collapses to M numbers. Learning becomes tractable.</text><text x="84" y="450" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">The price: IIA is an axiom about the world, not a fact. It fails when options are similar.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 1.8, original plate. Shell 3: the ratio.</text></svg>