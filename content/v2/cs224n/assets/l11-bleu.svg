<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>BLEU: precision plus brevity penalty</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">BLEU: n-gram precision, penalize brevity</text><rect x="60" y="90" width="300" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">n-gram precision</text><text x="210" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">how many predicted n-grams</text><text x="210" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">appear in references</text><rect x="400" y="90" width="300" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">brevity penalty</text><text x="550" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">predicting only &quot;the&quot;</text><text x="550" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">games precision; penalize it</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">ROUGE flips it: recall instead of precision.</text></svg>