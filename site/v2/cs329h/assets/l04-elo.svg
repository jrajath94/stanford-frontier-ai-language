<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Elo: online Bradley-Terry</text><text x="40" y="82" font-size="17" fill="#5C6B7A">One update per game, no dataset needed.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="1000" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="210" font-size="18" font-weight="600" fill="#1B2838" text-anchor="start">V_new = V_old + K x (score - expected)</text><text x="88" y="244" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Both players rated 1500. K = 32. A wins: expected was 0.50.</text><text x="88" y="278" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">A: 1500 + 32 x (1 - 0.50) = 1516.   B: 1500 + 32 x (0 - 0.50) = 1484.</text><text x="88" y="312" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">An upset moves more points: beating a 1700-rated player from 1500 gains about 26, not 16.</text><text x="88" y="346" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">K is the learning rate and the forgetting rate: high K adapts fast, low K is stable.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 2.5, original plate. Shell 3: the update.</text></svg>