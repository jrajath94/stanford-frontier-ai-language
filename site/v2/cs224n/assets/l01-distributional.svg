<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Distributional semantics</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Know a word by the company it keeps</text><text x="380" y="64" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">J. R. Firth, 1957</text><rect x="120" y="100" width="520" height="50" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="131" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">government debt problems turning into banking crises</text><rect x="120" y="162" width="520" height="50" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="193" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">Europe needs unified banking regulation to replace</text><rect x="120" y="224" width="520" height="50" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="255" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">India has given its banking system a shot in the arm</text><text x="120" y="292" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Contexts of &#x27;banking&#x27; teach its meaning: money, not rivers.</text></svg>