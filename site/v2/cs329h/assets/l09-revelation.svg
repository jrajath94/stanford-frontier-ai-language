<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="540" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The revelation principle</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Any equilibrium can be mimicked by a truthful mechanism.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="180" width="440" height="160" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="180" width="8" height="160" rx="4" fill="#5C6B7A"/><text x="84" y="212" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">complex game</text><text x="84" y="238" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">strategic bids</text><text x="84" y="262" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">equilibrium play</text><rect x="620" y="180" width="440" height="160" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="180" width="8" height="160" rx="4" fill="#1F7A72"/><text x="644" y="212" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">direct mechanism</text><text x="644" y="238" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">report true values</text><text x="644" y="262" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">same outcome</text><line x1="500" y1="260" x2="620" y2="260" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,260 l-11,-4.5 M620,260 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="247.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="265.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">simulate</text><text x="60" y="400" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Designers can restrict attention to incentive-compatible direct mechanisms without loss.</text><text x="40" y="512" font-size="14" fill="#5C6B7A">Source: textbook ch 5.10, original plate. Shell 4: the reduction.</text></svg>