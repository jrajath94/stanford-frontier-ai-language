<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Model collapse: tails decay geometrically</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 9. Sampling concentrates. Each generation trains on the last one's sample.</text>
<rect x="60" y="140" width="200" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
