<text x="592" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">gen 2</text>
<text x="592" y="295.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">top 10 dominate</text>
