<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Signifier versus signified, and WordNet failures</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Word meaning: symbol to idea</text><rect x="90" y="80" width="180" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="180" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">signifier</text><text x="180" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">the word &#x27;tree&#x27;</text><rect x="490" y="80" width="180" height="90" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="580" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">signified</text><text x="580" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">the idea of a tree</text><line x1="270" y1="125" x2="490" y2="125" stroke="#2B2B2B" stroke-width="2"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">denotes</text><text x="90" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">WordNet tried to store meaning as lists: synonyms, hypernyms.</text><text x="90" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Fails: nuance (&#x27;proficient&#x27; is not always &#x27;good&#x27;), new senses (&#x27;ninja&#x27;), cost.</text><text x="90" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Similarity between two words cannot be computed from lists.</text></svg>