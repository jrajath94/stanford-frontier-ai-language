<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Two vectors per word</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Two vectors per word: v and u</text><rect x="100" y="90" width="240" height="120" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="220" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#1F7A6D" text-anchor="middle" font-weight="bold">v_w</text><text x="220" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">center word vector</text><text x="220" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">used when w is c</text><rect x="420" y="90" width="240" height="120" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="540" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#D96830" text-anchor="middle" font-weight="bold">u_w</text><text x="540" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">outside word vector</text><text x="540" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">used when w is o</text><text x="100" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Final word vector: average v and u.</text><text x="100" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Both are part of theta. Gradients flow into both.</text></svg>