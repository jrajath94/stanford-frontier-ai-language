<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Word error rate</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">25% word error rate, improving</text><rect x="60" y="90" width="300" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="210" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">this system</text><text x="210" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2B2B2B" text-anchor="middle" font-weight="bold">25% WER</text><text x="210" y="174" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">25 of 100 words wrong</text><rect x="400" y="90" width="300" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="550" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">UC Davis</text><text x="550" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2B2B2B" text-anchor="middle" font-weight="bold">close to zero WER</text><text x="550" y="174" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">continuous training, daily use</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The participant uses it daily with family.</text></svg>