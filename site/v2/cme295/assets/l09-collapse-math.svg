<text x="376" y="295.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">top 20 dominate</text>
