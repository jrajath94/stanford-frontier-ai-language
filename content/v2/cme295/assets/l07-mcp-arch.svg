<text x="480" y="440.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">The server advertises capabilities at connect time. The client exposes them as tool schemas.</text>
<text x="480" y="480.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Write the book tools once. Every MCP client uses them. The 2026 standard.</text>
