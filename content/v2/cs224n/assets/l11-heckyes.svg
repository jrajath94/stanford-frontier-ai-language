<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>BLEU false positives and negatives</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Reference: &quot;heck yes&quot;</text><rect x="60" y="90" width="640" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="90" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">&quot;yes&quot;</text><text x="220" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="bold" font-weight="normal">67% BLEU</text><text x="420" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">partial match</text><rect x="60" y="162" width="640" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="90" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">&quot;yep&quot;</text><text x="220" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="bold" font-weight="normal">0 BLEU</text><text x="420" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">false negative: means the same</text><rect x="60" y="234" width="640" height="60" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="90" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">&quot;heck no&quot;</text><text x="220" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="bold" font-weight="normal">~7x words match</text><text x="420" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">false positive: means the opposite</text><text x="60" y="322" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">N-gram overlap is not meaning.</text></svg>