<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img"><title>Attention steps</title><rect width="760" height="380" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Attention: query, score, weight, average</text><rect x="24" y="90" width="136" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="92" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">1. decoder state</text><text x="92" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">as query</text><line x1="160" y1="135" x2="184" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="184,135 175,131 175,139" fill="#5A5A52"/><rect x="168" y="90" width="136" height="90" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="236" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">2. compare with</text><text x="236" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">each encoder state</text><line x1="304" y1="135" x2="328" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="328,135 319,131 319,139" fill="#5A5A52"/><rect x="312" y="90" width="136" height="90" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="380" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">3. softmax</text><text x="380" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">attention scores</text><line x1="448" y1="135" x2="472" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="472,135 463,131 463,139" fill="#5A5A52"/><rect x="456" y="90" width="136" height="90" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="524" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">4. weighted average</text><text x="524" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">of encoder states</text><line x1="592" y1="135" x2="616" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="616,135 607,131 607,139" fill="#5A5A52"/><rect x="600" y="90" width="136" height="90" fill="#FFFFFF" stroke="#3D8B4F" stroke-width="2" rx="10"/><text x="668" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">5. concatenate</text><text x="668" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">and predict</text><line x1="736" y1="135" x2="760" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="760,135 751,131 751,139" fill="#5A5A52"/><text x="24" y="230" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The decoder looks back at the source, like a human translator.</text><text x="24" y="256" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Each step gets its own context vector.</text><text x="24" y="282" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Direct connections shorten gradient paths: helps vanishing.</text><text x="24" y="308" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">General form: values H_1..n + query -&gt; scores -&gt; weights -&gt; output.</text><text x="24" y="334" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Bahdanau et al., 2015.</text></svg>