<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Agent failure modes</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Models make trivial, unrecoverable mistakes</text><rect x="60" y="90" width="640" height="80" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="90" y="122" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Google Translate sign-in: typed the email into the password field.</text><text x="90" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Could not recover. Kept retyping.</text><rect x="60" y="190" width="640" height="80" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="90" y="222" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Search task: repeated the same query three times.</text><text x="90" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">No results. No adaptation.</text><text x="60" y="300" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="bold" font-weight="normal">Long-horizon planning is still very hard.</text></svg>