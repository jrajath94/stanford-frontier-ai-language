<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Regularization trades fit for generalization</text><text x="40" y="82" font-size="17" fill="#5C6B7A">More capacity helps, then hurts.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><line x1="140" y1="450" x2="940" y2="450" stroke="#1B2838" stroke-width="1.5"/><line x1="140" y1="450" x2="140" y2="150" stroke="#1B2838" stroke-width="1.5"/><text x="934" y="478" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="end">model capacity</text><text x="126" y="160" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="end">error</text><polyline points="140,180 340,285 540,345 740,375 940,390" fill="none" stroke="#1F7A72" stroke-width="2.5"/><polyline points="140,165 340,270 540,324 740,300 940,225" fill="none" stroke="#C46B2C" stroke-width="2.5"/><text x="550.0" y="312.0" font-size="13" font-weight="450" fill="#C46B2C" text-anchor="start">test error (U-turn)</text><text x="750.0" y="391.0" font-size="13" font-weight="450" fill="#1F7A72" text-anchor="start">train error</text><text x="60" y="520" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">L2 / priors / early stopping pick the bottom of the U. Reward models overfit the same way.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 2.6, original plate. Shell 3: the U-turn.</text></svg>