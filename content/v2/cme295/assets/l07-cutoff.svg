<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l07-cutoff" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-cutoff" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">The knowledge cutoff problem</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. The model only knows its training data.</text>
<rect x="60" y="130" width="840" height="100" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">"Who won the election two weeks ago?"</text>
<text x="480" y="204.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Cutoff was a month ago. The model guesses or refuses.</text>
<rect x="60" y="270" width="200" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="312.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Retrain?</text>
<text x="300" y="300.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">tricky: regressions, maintenance per use case</text>
<text x="300" y="328.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#C46B2C" dominant-baseline="middle">avoid</text>
<rect x="60" y="370" width="200" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="412.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Dump everything in context?</text>
<text x="300" y="400.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">limited ctx, needle-in-haystack, $/token</text>
<text x="300" y="428.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#C46B2C" dominant-baseline="middle">avoid</text>
<rect x="60" y="470" width="200" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="512.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Retrieve only what matters</text>
<text x="300" y="500.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">RAG: relevant chunks in the prompt</text>
<text x="300" y="528.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1F7A72" dominant-baseline="middle">do this</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>