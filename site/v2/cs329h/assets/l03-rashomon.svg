<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The Rashomon effect</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Many different models fit the same data equally well.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="170" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Bradley-Terry</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">90% accuracy</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fits the data</text><rect x="400" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="400" y="170" width="8" height="170" rx="4" fill="#C46B2C"/><text x="424" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">2-group mixture</text><text x="424" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">90% accuracy</text><text x="424" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fits the data</text><rect x="740" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="740" y="170" width="8" height="170" rx="4" fill="#1E4D8C"/><text x="764" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">nested logit</text><text x="764" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">90% accuracy</text><text x="764" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fits the data</text><rect x="60" y="380" width="1000" height="110" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="412" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Identification is algebra: V and V + c mean the same thing. Rashomon is empirical:</text><text x="84" y="440" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">different structures tie on the data. Do not read one fitted model as the truth.</text><text x="84" y="468" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">In RLHF: many reward functions fit the feedback. Each induces a different policy.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 1.9, original plate. Shell 4: the multiplicity.</text></svg>