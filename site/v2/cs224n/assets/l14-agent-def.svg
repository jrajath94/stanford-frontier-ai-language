<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>What an agent is</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Agent: a network in a loop with the world</text><rect x="24" y="100" width="140" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="94" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#1F7A6D" text-anchor="middle" font-weight="bold">agent</text><text x="94" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="11" fill="#5A5A52" text-anchor="middle" font-weight="normal">neural network</text><line x1="164" y1="145" x2="188" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="188,145 179,141 179,149" fill="#5A5A52"/><rect x="172" y="100" width="140" height="90" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="242" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#D96830" text-anchor="middle" font-weight="bold">environment</text><text x="242" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="11" fill="#5A5A52" text-anchor="middle" font-weight="normal">browser, OS, tools</text><line x1="312" y1="145" x2="336" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="336,145 327,141 327,149" fill="#5A5A52"/><rect x="320" y="100" width="140" height="90" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="390" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2E6BE6" text-anchor="middle" font-weight="bold">observation</text><text x="390" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="11" fill="#5A5A52" text-anchor="middle" font-weight="normal">pixels, HTML DOM</text><line x1="460" y1="145" x2="484" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="484,145 475,141 475,149" fill="#5A5A52"/><rect x="468" y="100" width="140" height="90" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="538" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#7C5CBF" text-anchor="middle" font-weight="bold">action</text><text x="538" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="11" fill="#5A5A52" text-anchor="middle" font-weight="normal">click, type</text><line x1="608" y1="145" x2="632" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="632,145 623,141 623,149" fill="#5A5A52"/><rect x="616" y="100" width="140" height="90" fill="#FFFFFF" stroke="#3D8B4F" stroke-width="2" rx="10"/><text x="686" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#3D8B4F" text-anchor="middle" font-weight="bold">goal G</text><text x="686" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="11" fill="#5A5A52" text-anchor="middle" font-weight="normal">language instruction</text><line x1="756" y1="145" x2="780" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="780,145 771,141 771,149" fill="#5A5A52"/><text x="24" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Also called: digital agent, language-conditioned policy,</text><text x="24" y="266" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">instruction-following agent.</text></svg>