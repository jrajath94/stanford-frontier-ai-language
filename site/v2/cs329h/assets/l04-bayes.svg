<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Bayes adds a prior, keeps uncertainty</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Posterior = likelihood x prior, normalized.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="170" rx="4" fill="#5C6B7A"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">prior</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">V ~ Normal(0, 1)</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">shrinks estimates</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">toward zero</text><rect x="410" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="170" width="8" height="170" rx="4" fill="#1F7A72"/><text x="434" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">likelihood</text><text x="434" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">BT on pairs</text><text x="434" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">as in MLE</text><rect x="760" y="170" width="300" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="170" width="8" height="170" rx="4" fill="#1E4D8C"/><text x="784" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">posterior</text><text x="784" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">distribution over V</text><text x="784" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">mean + variance</text><text x="784" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">MCMC samples</text><line x1="360" y1="255" x2="410" y2="255" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,255 l-11,-4.5 M410,255 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="313.0" y="242.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="385.0" y="260.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">x</text><line x1="710" y1="255" x2="760" y2="255" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,255 l-11,-4.5 M760,255 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="663.0" y="242.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="735.0" y="260.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">-&gt;</text><text x="60" y="390" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Use the posterior when the decision needs uncertainty: Thompson sampling asks for a distribution, not a point.</text><text x="60" y="418" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">MLE with L2 is the posterior mode under a Gaussian prior: the two views meet at the MAP estimate.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 2.4, original plate. Shell 3: the update.</text></svg>