<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l09-diffusion" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l09-diffusion" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Diffusion: carve the image out of noise</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 9. Start from Gaussian noise. Learn to denoise.</text>
<rect x="80" y="160" width="200" height="160" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="240.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">noise</text>
<text x="180" y="263.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Gaussian</text>
<text x="180" y="280.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle"> easy to sample</text>
<line x1="280" y1="240" x2="360" y2="240" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l09-diffusion)"/>
<rect x="270.5" y="228.9" width="98.9" height="22.1" rx="8" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/>
<text x="320.0" y="240.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" dominant-baseline="middle">denoise x N</text>
<rect x="360" y="160" width="200" height="160" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="460" y="240.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">less noise</text>
<line x1="560" y1="240" x2="640" y2="240" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l09-diffusion)"/>
<rect x="640" y="160" width="200" height="160" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="740" y="240.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">image</text>
<rect x="80" y="390" width="800" height="170" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="428.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Sculptor analogy (Michelangelo): the statue is in the marble. Remove what is not statue.</text>
<text x="480" y="468.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Forward process: add noise gradually. Reverse: predict the noise to remove.</text>
<text x="480" y="504.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Why noise: models well, samples easily, adds the randomness you want.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>