<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Vanishing versus exploding gradients</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">30 steps multiply the same Jacobian</text><text x="380" y="64" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">identity-sigma gives powers of W_h</text><text x="200" y="100" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">eigenvalue &lt; 1: vanish</text><rect x="90" y="120" width="220" height="16" fill="#2E6BE6" rx="5" opacity="0.95"/><rect x="90" y="144" width="158.4" height="16" fill="#2E6BE6" rx="5" opacity="0.82"/><rect x="90" y="168" width="114.048" height="16" fill="#2E6BE6" rx="5" opacity="0.69"/><rect x="90" y="192" width="82.11456" height="16" fill="#2E6BE6" rx="5" opacity="0.5599999999999999"/><rect x="90" y="216" width="59.1224832" height="16" fill="#2E6BE6" rx="5" opacity="0.42999999999999994"/><rect x="90" y="240" width="42.568187904" height="16" fill="#2E6BE6" rx="5" opacity="0.29999999999999993"/><text x="200" y="300" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">shrinks to zero</text><text x="560" y="100" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">eigenvalue &gt; 1: explode</text><rect x="440" y="120" width="30" height="16" fill="#D96830" rx="5"/><rect x="440" y="144" width="52.5" height="16" fill="#D96830" rx="5"/><rect x="440" y="168" width="91.875" height="16" fill="#D96830" rx="5"/><rect x="440" y="192" width="160.78125" height="16" fill="#D96830" rx="5"/><rect x="440" y="216" width="240" height="16" fill="#D96830" rx="5"/><rect x="440" y="240" width="240" height="16" fill="#D96830" rx="5"/><text x="560" y="300" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">blows up</text><text x="60" y="280" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Vanishing is worse: no signal survives.</text></svg>