<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l02-kv-bytes" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l02-kv-bytes" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">KV cache bytes: GQA's 4x saving, counted</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 2. 70B model, 32 layers, fp16, 4K context.</text>
<rect x="60" y="120" width="840" height="240" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="165.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">per token: 2 (K,V) x 32 layers x 8 heads x 128 dim x 2 bytes = 131,072 bytes = 128 KB</text>
<text x="480" y="215.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">4,096 tokens x 128 KB = 512 MB per sequence (GQA, 8 KV heads)</text>
<text x="480" y="260.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#C46B2C" dominant-baseline="middle">MHA with 32 KV heads: 4x the heads = 2 GB per sequence</text>
<text x="480" y="305.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">batch 32: 16 GB (GQA) vs 64 GB (MHA). The cache is the serving bottleneck.</text>
<rect x="60" y="400" width="840" height="160" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="440.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Decision rule: the cache, not the weights, sets max batch size.</text>
<text x="480" y="480.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">GQA/MQA/MLA exist to shrink this number. Every serving trick downstream assumes it.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>