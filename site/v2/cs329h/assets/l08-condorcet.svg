<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The Condorcet paradox</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Majorities can cycle: A beats B beats C beats A.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="130" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">voter 1</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">A &gt; B &gt; C</text><rect x="400" y="170" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="400" y="170" width="8" height="130" rx="4" fill="#1E4D8C"/><text x="424" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">voter 2</text><text x="424" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">B &gt; C &gt; A</text><rect x="740" y="170" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="740" y="170" width="8" height="130" rx="4" fill="#1E4D8C"/><text x="764" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">voter 3</text><text x="764" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">C &gt; A &gt; B</text><rect x="60" y="340" width="1000" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="380" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">A vs B: voters 1,3 prefer A  -&gt;  A wins</text><text x="88" y="410" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">B vs C: voters 1,2 prefer B  -&gt;  B wins</text><text x="88" y="440" font-size="15" font-weight="600" fill="#8A2A1B" text-anchor="start">C vs A: voters 2,3 prefer C  -&gt;  C wins</text><text x="88" y="470" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">No Condorcet winner exists. Transitivity fails at the group level.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 5.2, original plate. Shell 3: the cycle.</text></svg>