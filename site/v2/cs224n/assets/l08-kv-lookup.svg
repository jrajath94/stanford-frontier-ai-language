<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Attention as fuzzy key-value lookup</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Attention: fuzzy key-value lookup</text><rect x="60" y="100" width="180" height="70" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="150" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">query</text><text x="150" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">what I need</text><rect x="290" y="100" width="180" height="70" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">keys</text><text x="380" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">what I offer</text><rect x="520" y="100" width="180" height="70" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="610" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2E6BE6" text-anchor="middle" font-weight="bold">values</text><text x="610" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">what I return</text><line x1="240" y1="135" x2="290" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="290,135 281,131 281,139" fill="#5A5A52"/><line x1="470" y1="135" x2="520" y2="135" stroke="#5A5A52" stroke-width="2"/><polygon points="520,135 511,131 511,139" fill="#5A5A52"/><text x="60" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Separate Q and K: a low-rank approximation of a bilinear form.</text><text x="60" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Efficiency first: fewer parameters, same comparison power.</text></svg>