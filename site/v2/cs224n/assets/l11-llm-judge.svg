<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>LLM as judge</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">LLM judges: 100x faster, 100x cheaper</text><rect x="40" y="90" width="330" height="120" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="205" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">agreement</text><text x="205" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">GPT-4 vs human majority:</text><text x="205" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">beats human-human agreement</text><text x="205" y="196" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">AlpacaEval: 98% rank correlation</text><rect x="390" y="90" width="330" height="120" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="555" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">biases</text><text x="555" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">length bias: ~70% prefer longer</text><text x="555" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">monoculture: one judge,</text><text x="555" y="196" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">same bias everywhere</text><text x="40" y="255" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">&quot;Never just believe numbers.&quot; Use detailed rubrics for LLM judges.</text><text x="40" y="281" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">HELM and the HF leaderboard: look at everything.</text><text x="40" y="307" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Implementation matters: LLaMA 65B MMLU 63.7 vs 63.6 vs 48.8.</text></svg>