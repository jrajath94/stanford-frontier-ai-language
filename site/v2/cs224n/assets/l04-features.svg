<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Sparse indicator features versus dense embeddings</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Millions of sparse features, replaced by dense ones</text><rect x="60" y="80" width="300" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="210" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">Indicator features</text><text x="210" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">millions of features</text><text x="210" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">one seen 10x in 1M sentences</text><text x="210" y="182" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">feature computation = most of runtime</text><rect x="400" y="80" width="300" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="550" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">Dense embeddings</text><text x="550" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">compact vectors</text><text x="550" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">similar words share signal</text><text x="550" y="182" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">fast and accurate</text><text x="60" y="235" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Old: accurate but sparse, incomplete, expensive.</text><text x="60" y="261" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">New: dense word + POS + label embeddings, concatenated.</text></svg>