<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img"><title>LSTM cell with three gates</title><rect width="760" height="380" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">LSTM: protect the cell with gates</text><rect x="60" y="90" width="160" height="80" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="140" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">forget</text><text x="140" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">(remember)</text><text x="140" y="154" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">0 to 1</text><rect x="300" y="90" width="160" height="80" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">input</text><text x="380" y="154" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">0 to 1</text><rect x="540" y="90" width="160" height="80" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="620" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">output</text><text x="620" y="154" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">0 to 1</text><rect x="200" y="220" width="360" height="60" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="380" y="244" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#7C5CBF" text-anchor="middle" font-weight="bold">cell = old x forget + candidate x input</text><text x="380" y="268" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">additive: gradient flows</text><line x1="380" y1="280" x2="380" y2="310" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,310 371,306 371,314" fill="#2B2B2B"/><rect x="200" y="310" width="360" height="50" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="380" y="340" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">hidden = output x tanh(cell)</text><text x="60" y="378" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Hochreiter and Schmidhuber, 1997. Google keyboard, 2014.</text></svg>