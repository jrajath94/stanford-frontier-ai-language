<text x="300" y="136.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">64 bits</text>
<text x="300" y="164.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">reference, slow</text>
<rect x="60" y="202" width="200" height="76" rx="8" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
