<text x="244" y="414.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">Predict the original.</text>
<rect x="496" y="270" width="440" height="170" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="716" y="306.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">NSP: next sentence?</text>
<text x="716" y="335.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">50%: true next sentence</text>
<text x="716" y="353.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">50%: random sentence</text>
<text x="716" y="414.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">[CLS] embedding decides.</text>
<rect x="24" y="480" width="912" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="518.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Fine-tuning: add one head on [CLS] for classification, per-token heads for tagging.</text>
<text x="480" y="552.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">RoBERTa drops NSP, masks dynamically, trains longer on more data. DistilBERT distills via KL.</text>
