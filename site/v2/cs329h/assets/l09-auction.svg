<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">An auction is a preference-elicitation machine</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Bids in, allocation and payments out.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="90" y="230" width="200" height="56" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="190.0" y="263.0" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">bidder 1: v=10</text><rect x="90" y="300" width="200" height="56" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="190.0" y="333.0" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">bidder 2: v=7</text><rect x="90" y="370" width="200" height="56" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="190.0" y="403.0" font-size="15" font-weight="500" fill="#1B2838" text-anchor="middle">bidder 3: v=5</text><line x1="310" y1="320" x2="480" y2="320" stroke="#1E4D8C" stroke-width="1.5"/><path d="M480,320 l-11,-4.5 M480,320 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="323.0" y="307.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="395.0" y="325.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">bids</text><rect x="500" y="220" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="500" y="220" width="8" height="200" rx="4" fill="#1E4D8C"/><text x="524" y="252" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">mechanism</text><text x="524" y="278" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">allocation rule</text><text x="524" y="302" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">payment rule</text><line x1="800" y1="320" x2="940" y2="320" stroke="#1E4D8C" stroke-width="1.5"/><path d="M940,320 l-11,-4.5 M940,320 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="830" y="220" width="230" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="830" y="220" width="8" height="200" rx="4" fill="#1F7A72"/><text x="854" y="252" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">outcome</text><text x="854" y="278" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">winner + price</text><text x="60" y="480" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Quasilinear utility: winner gets v_i - p_i, losers get 0. Money makes preferences comparable.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 5.10, original plate. Shell 2: the mechanism.</text></svg>