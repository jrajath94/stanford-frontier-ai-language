<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Plackett-Luce builds rankings in stages</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Pick the winner, then the winner of the rest.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="300" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="8" height="210" rx="4" fill="#1F7A72"/><text x="84" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Stage 1: pick first</text><text x="84" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">e^2 / (e^2+e^1+e^0)</text><text x="84" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">= 0.665</text><text x="84" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">A wins</text><rect x="410" y="160" width="300" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="160" width="8" height="210" rx="4" fill="#1F7A72"/><text x="434" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Stage 2: pick second</text><text x="434" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">e^1 / (e^1+e^0)</text><text x="434" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">= 0.731</text><text x="434" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">B wins</text><rect x="760" y="160" width="300" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="160" width="8" height="210" rx="4" fill="#1F7A72"/><text x="784" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Stage 3: last left</text><text x="784" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">C</text><text x="784" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">= 1.000</text><text x="784" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">C last</text><line x1="360" y1="265" x2="410" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,265 l-11,-4.5 M410,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="313.0" y="252.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="385.0" y="270.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">remove A</text><line x1="710" y1="265" x2="760" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,265 l-11,-4.5 M760,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="663.0" y="252.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="735.0" y="270.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">remove B</text><rect x="60" y="410" width="1000" height="100" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="442" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">p(A &gt; B &gt; C) = 0.665 x 0.731 = 0.486. The most likely ranking has A first, about 49% of the time.</text><text x="84" y="472" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Binary comparisons are the special case with two items: PL reduces to Bradley-Terry.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 1 worked example, original plate. Shell 3: the stages.</text></svg>