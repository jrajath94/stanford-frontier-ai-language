<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Individual vs group fairness</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Two reasonable definitions, mutually incompatible.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="200" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">individual fairness</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">similar individuals -&gt;</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">similar outcomes</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">d(xi,xj) small =&gt; d(f(xi),f(xj)) small</text><rect x="600" y="170" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="170" width="8" height="200" rx="4" fill="#C46B2C"/><text x="624" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">group fairness</text><text x="624" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">protected groups -&gt;</text><text x="624" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">equal average outcomes</text><text x="624" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">E[f|g1] = E[f|g2]</text><rect x="60" y="410" width="1000" height="100" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="442" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Peer review: small subfields have few experts. Individual fairness gives them weaker reviewers.</text><text x="84" y="470" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">group fairness demands equal reviewer quality. Both cannot hold. Choose consciously.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 4.4 (Dwork et al. 2012), original plate. Shell 4: the clash.</text></svg>