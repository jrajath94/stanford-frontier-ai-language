<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>The seq2seq bottleneck</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">One fixed vector cannot hold a sentence</text><rect x="60" y="100" width="640" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="135" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="normal">source sentence: many words</text><line x1="380" y1="160" x2="380" y2="200" stroke="#D96830" stroke-width="2"/><polygon points="380,200 371,196 371,204" fill="#D96830"/><rect x="300" y="200" width="160" height="44" fill="#D96830" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="380" y="228" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">one vector</text><line x1="380" y1="244" x2="380" y2="278" stroke="#D96830" stroke-width="2"/><polygon points="380,278 371,274 371,282" fill="#D96830"/><text x="60" y="296" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Stuffing a whole sentence into one vector is implausible.</text></svg>