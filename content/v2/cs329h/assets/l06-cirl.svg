<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">CIRL: the human teaches, the robot learns</text><text x="40" y="82" font-size="17" fill="#5C6B7A">A two-player game with one shared goal.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="460" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="210" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">human H</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">knows the true reward theta</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">acts to TEACH, not just</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">to maximize reward</text><text x="84" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">instructive &gt; demonstrative</text><rect x="600" y="170" width="460" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="170" width="8" height="210" rx="4" fill="#1E4D8C"/><text x="624" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">robot R</text><text x="624" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">does not know theta</text><text x="624" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">holds belief b(theta)</text><text x="624" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">updates via Bayes</text><text x="624" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">acts to help</text><rect x="60" y="420" width="1000" height="100" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="452" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Shared payoff R(s, aH, aR, theta). The human's best move may sacrifice reward to reveal theta.</text><text x="84" y="480" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Breaks the passive-oracle assumption: feedback depends on what the human thinks you will do with it.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 3.8, original plate. Shell 4: the game.</text></svg>