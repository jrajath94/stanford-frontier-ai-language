<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Arrow: no perfect voting rule</text><text x="40" y="82" font-size="17" fill="#5C6B7A">With 3+ options, four mild axioms cannot all hold.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="250" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="8" height="170" rx="4" fill="#5C6B7A"/><text x="64" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">unrestricted domain</text><text x="64" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">any ballots allowed</text><rect x="310" y="170" width="250" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="310" y="170" width="8" height="170" rx="4" fill="#1F7A72"/><text x="334" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Pareto</text><text x="334" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">unanimity respected</text><rect x="580" y="170" width="250" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="580" y="170" width="8" height="170" rx="4" fill="#1E4D8C"/><text x="604" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">IIA</text><text x="604" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">irrelevant options ignored</text><rect x="850" y="170" width="250" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="850" y="170" width="8" height="170" rx="4" fill="#C46B2C"/><text x="874" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">non-dictatorship</text><text x="874" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">no single voter rules</text><rect x="40" y="380" width="1040" height="110" rx="8" fill="#F9E9E4" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="414" font-size="16" font-weight="600" fill="#8A2A1B" text-anchor="start">Theorem: no social welfare function satisfies all four. Something must give.</text><text x="64" y="444" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Borda escapes by weakening IIA to IIA-prime: rank gaps may matter, not just order.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 5.2-5.3, original plate. Shell 4: the impossibility.</text></svg>