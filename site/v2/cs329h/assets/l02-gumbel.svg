<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Gumbel noise produces the logit</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Utility plus independent noise. The winner is chosen.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="120" y="180.0" width="120" height="240.0" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="180.0" y="444" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle">A</text><text x="180.0" y="170.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">V=2.0</text><rect x="340" y="255.0" width="120" height="165.0" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="400.0" y="444" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle">B</text><text x="400.0" y="245.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">V=1.0</text><rect x="560" y="330.0" width="120" height="89.99999999999999" rx="8" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="620.0" y="444" font-size="15" font-weight="450" fill="#1B2838" text-anchor="middle">C</text><text x="620.0" y="320.0" font-size="13" font-weight="450" fill="#5C6B7A" text-anchor="middle">V=0.0</text><text x="120" y="150" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">mean utilities V</text><line x1="480" y1="300" x2="620" y2="300" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,300 l-11,-4.5 M620,300 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="478.0" y="287.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="550.0" y="305.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">add iid Gumbel noise</text><rect x="640" y="200" width="380" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="640" y="200" width="8" height="200" rx="4" fill="#1F7A72"/><text x="664" y="232" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">realized draw</text><text x="664" y="258" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">A: 2.0 + 0.3 = 2.3  &lt;- winner</text><text x="664" y="282" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">B: 1.0 - 0.1 = 0.9</text><text x="664" y="306" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">C: 0.0 + 0.2 = 0.2</text><text x="120" y="500" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Repeat the draw many times: the win fractions converge to the softmax of V.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 1.7-1.8, original plate. Shell 3: the noise draw.</text></svg>