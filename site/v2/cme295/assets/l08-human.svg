<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Human ratings: the ideal you cannot afford</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 8. Subjective tasks break simple agreement.</text>
<rect x="60" y="130" width="840" height="110" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">"What birthday gift should I get?"</text>
<text x="480" y="204.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">"A teddy bear is almost always a sweet gift." Useful? Two raters disagree.</text>
<rect x="60" y="280" width="200" height="80" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="320.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Slow</text>
<text x="300" y="308.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">rating 1000 outputs takes days</text>
<text x="300" y="336.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#C46B2C" dominant-baseline="middle">expensive</text>
<rect x="60" y="376" width="200" height="80" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="416.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Subjective</text>
<text x="300" y="404.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">usefulness is in the eye of the rater</text>
<text x="300" y="432.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#C46B2C" dominant-baseline="middle">needs guidelines</text>
<rect x="60" y="472" width="200" height="80" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="512.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Drifty</text>
