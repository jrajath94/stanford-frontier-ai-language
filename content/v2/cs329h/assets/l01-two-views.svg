<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Two equivalent views of noisy choice</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Same predictions, different story.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="8" height="200" rx="4" fill="#1F7A72"/><text x="84" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Deterministic utility</text><text x="84" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">utility Hij is fixed</text><text x="84" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">noise in the response</text><text x="84" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Yij ~ Bernoulli(sigma(Hij))</text><text x="84" y="290" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">psychometrics view</text><rect x="600" y="160" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="160" width="8" height="200" rx="4" fill="#C46B2C"/><text x="624" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Stochastic utility</text><text x="624" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">utility is random: Hij + noise</text><text x="624" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">noise in the evaluation</text><text x="624" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">choose max realized utility</text><text x="624" y="290" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">economics view</text><rect x="60" y="400" width="1000" height="80" rx="8" fill="#E7F4EF" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="432" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Observationally equivalent: both give p(j &gt; k) = sigma(Vj - Vk) on pairwise data.</text><text x="84" y="458" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">The choice matters when you interpret the noise: heterogeneity vs error vs belief.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 1.6.5, original plate. Shell 2: the two views.</text></svg>