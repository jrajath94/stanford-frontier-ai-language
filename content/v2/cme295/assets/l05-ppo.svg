<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l05-ppo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l05-ppo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">PPO: move, but not too far</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 5. Maximize the clipped objective. r = pi_theta / pi_old is a ratio.</text>
<rect x="60" y="120" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="158.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">L = min( r * A , clip(r, 1-eps, 1+eps) * A )</text>
<text x="480" y="198.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">maximize this. r is a probability ratio, not a reward.</text>
<rect x="60" y="270" width="400" height="180" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="306.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Clip</text>
<text x="260" y="335.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">If A &gt; 0: cap the upside.</text>
<text x="260" y="353.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">If A &lt; 0: floor the downside.</text>
<text x="260" y="414.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">no giant steps</text>
<rect x="500" y="270" width="400" height="180" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="306.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">KL penalty</text>
<text x="700" y="335.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">beta * KL(pi || pi_ref)</text>
<text x="700" y="353.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">stay near the SFT model</text>
<text x="700" y="414.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">fights reward hacking</text>
<text x="480" y="510.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Four models in memory: policy, reference, reward (frozen), value. ~100k+ rollouts.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>