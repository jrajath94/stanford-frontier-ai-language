<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l01-end-to-end" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l01-end-to-end" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">End to end: English to French</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 1 slides. The full pipeline on one sentence.</text>
<text x="24" y="116.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">Input: A cute teddy bear is reading.</text>
<rect x="120" y="150" width="720" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="182.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">[BOS] A cute teddy bear is reading . [EOS]</text>
<rect x="120" y="246" width="720" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="278.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">embeddings + position encoding</text>
<line x1="480" y1="238" x2="480" y2="246" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l01-end-to-end)"/>
<rect x="120" y="342" width="720" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="374.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">ENCODER: context-aware embeddings</text>
<line x1="480" y1="334" x2="480" y2="342" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l01-end-to-end)"/>
<rect x="120" y="438" width="720" height="64" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="470.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">DECODER starts from [BOS]</text>
<line x1="480" y1="430" x2="480" y2="438" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l01-end-to-end)"/>
<rect x="120" y="534" width="720" height="80" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="574.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Un ours en peluche mignon lit . [EOS]</text>
<line x1="480" y1="526" x2="480" y2="534" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l01-end-to-end)"/>
<rect x="404.1" y="519.0" width="151.7" height="22.1" rx="8" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/>
<text x="480.0" y="530.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" dominant-baseline="middle">softmax over vocab</text>
<text x="480" y="610.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Each step: linear + softmax over V classes, where each class is a word.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
