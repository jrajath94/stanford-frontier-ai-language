<text x="480" y="330.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Accept a, b. Reject c, d. Resample from the target at c. Repeat.</text>
<rect x="60" y="390" width="840" height="140" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="428.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Why it wins: verification is one memory pass for k tokens.</text>
<text x="480" y="466.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Multi-token prediction: train the model to emit k tokens per step. Same idea, learned.</text>
