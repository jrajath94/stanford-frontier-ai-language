<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Learning rate too large overshoots</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Step size decides stability</text><line x1="120" y1="260" x2="310" y2="260" stroke="#5A5A52" stroke-width="2"/><line x1="215" y1="80" x2="215" y2="260" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="120" y1="100" x2="160" y2="160" stroke="#1F7A6D" stroke-width="3"/><line x1="160" y1="160" x2="190" y2="205" stroke="#1F7A6D" stroke-width="3"/><line x1="190" y1="205" x2="210" y2="240" stroke="#1F7A6D" stroke-width="3"/><circle cx="120" cy="100" r="5" fill="#1F7A6D"/><circle cx="160" cy="160" r="5" fill="#1F7A6D"/><circle cx="190" cy="205" r="5" fill="#1F7A6D"/><circle cx="210" cy="240" r="5" fill="#1F7A6D"/><text x="215" y="285" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">small step: slow, steady</text><text x="215" y="66" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">alpha = 1e-4</text><line x1="450" y1="260" x2="640" y2="260" stroke="#5A5A52" stroke-width="2"/><line x1="545" y1="80" x2="545" y2="260" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="450" y1="100" x2="560" y2="130" stroke="#D96830" stroke-width="3"/><line x1="560" y1="130" x2="480" y2="175" stroke="#D96830" stroke-width="3"/><line x1="480" y1="175" x2="585" y2="215" stroke="#D96830" stroke-width="3"/><circle cx="450" cy="100" r="5" fill="#D96830"/><circle cx="560" cy="130" r="5" fill="#D96830"/><circle cx="480" cy="175" r="5" fill="#D96830"/><circle cx="585" cy="215" r="5" fill="#D96830"/><text x="545" y="285" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">big step: overshoots</text><text x="545" y="66" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">alpha too large</text></svg>