<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>The simple LM agent loop</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">&quot;Just Chain of Thought prompting in a loop&quot;</text><rect x="60" y="100" width="640" height="70" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">instruction + action space + history</text><text x="380" y="152" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">-&gt; next action</text><line x1="380" y1="170" x2="380" y2="205" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,205 371,201 371,209" fill="#2B2B2B"/><rect x="230" y="205" width="300" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="230" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">environment responds</text><text x="380" y="252" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">new observation, repeat</text><text x="60" y="300" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Trajectory modeling: P(trajectory|goal) = dynamics x policy.</text></svg>