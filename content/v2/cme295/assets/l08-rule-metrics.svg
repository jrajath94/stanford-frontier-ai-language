<text x="160" y="314.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">summarization</text>
<text x="300" y="280.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">recall-flavored overlap</text>
<text x="300" y="314.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#C46B2C" dominant-baseline="middle">limit: many variants</text>
