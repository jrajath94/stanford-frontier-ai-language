<rect x="36" y="350" width="888" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="388.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">R1-Zero: no SFT at all. AIME accuracy climbs with RL steps. But chains mix languages.</text>
<text x="480" y="428.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Fixes: cold-start SFT for format, language-consistency reward, harmlessness on think tokens.</text>
<rect x="36" y="500" width="888" height="130" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="538.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Distillation: R1 writes answers with thoughts. Small model fits the sequences. Beats RL from scratch.</text>
<text x="480" y="578.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Result: competitive with o1-mini at small sizes.</text>
