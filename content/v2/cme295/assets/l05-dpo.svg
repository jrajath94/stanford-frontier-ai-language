<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l05-dpo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l05-dpo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">DPO: the reward model is secretly the policy</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 5. Two models, no RL loop. beta ~ 0.1.</text>
<rect x="60" y="110" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="110" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1F7A72" dominant-baseline="middle">1</text>
<text x="170" y="140.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">1. Write the RLHF objective</text>
<text x="170" y="168.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">maximize reward - beta * KL</text>
<rect x="60" y="210" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="110" y="252.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1F7A72" dominant-baseline="middle">2</text>
<text x="170" y="240.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">2. Solve for the optimal policy</text>
<text x="170" y="268.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">pi* in closed form</text>
<rect x="60" y="310" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="110" y="352.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1F7A72" dominant-baseline="middle">3</text>
<text x="170" y="340.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">3. Plug pi* into Bradley-Terry</text>
<text x="170" y="368.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">reward cancels out</text>
<rect x="60" y="410" width="840" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="110" y="452.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1F7A72" dominant-baseline="middle">4</text>
<text x="170" y="440.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">4. Train pi directly on pairs</text>
<text x="170" y="468.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">plain supervised loss</text>
<rect x="60" y="530" width="840" height="56" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="558.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Cheaper than PPO. Caveat: pairs come from another policy, distribution shift bites.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>