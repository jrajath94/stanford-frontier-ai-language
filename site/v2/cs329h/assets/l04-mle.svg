<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Maximum likelihood on pairs</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Choose the utilities that make the observed wins most probable.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="180" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="180" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">data</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">pair (j, k)</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">label y = 1</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">j won</text><rect x="410" y="170" width="300" height="180" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="170" width="8" height="180" rx="4" fill="#1F7A72"/><text x="434" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">model</text><text x="434" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = sigma(Vj - Vk)</text><text x="434" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">log-loss:</text><text x="434" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">-[y log p + (1-y) log(1-p)]</text><rect x="760" y="170" width="300" height="180" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="170" width="8" height="180" rx="4" fill="#C46B2C"/><text x="784" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">fit</text><text x="784" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">gradient ascent</text><text x="784" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">on V</text><text x="784" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">anchor V1 = 0</text><line x1="360" y1="260" x2="410" y2="260" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,260 l-11,-4.5 M410,260 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="313.0" y="247.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="385.0" y="265.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">score</text><line x1="710" y1="260" x2="760" y2="260" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,260 l-11,-4.5 M760,260 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="663.0" y="247.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="735.0" y="265.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">optimize</text><rect x="60" y="390" width="1000" height="100" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="422" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">BT fitting is logistic regression on pair differences. With 200 pairs over 50 responses,</text><text x="84" y="450" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">add L2: lambda = 0.05 keeps utilities from exploding on perfectly-separated pairs.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 2.3/2.9, original plate. Shell 3: the fit.</text></svg>