<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Prepositional phrase attachment ambiguity</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">&quot;Scientists count whales from space&quot;</text><rect x="60" y="80" width="300" height="120" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">Reading 1</text><text x="210" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">&#x27;from space&#x27; modifies</text><text x="210" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">&#x27;count&#x27;: counting</text><text x="210" y="182" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">happens from space</text><rect x="400" y="80" width="300" height="120" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">Reading 2</text><text x="550" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">&#x27;from space&#x27; modifies</text><text x="550" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">&#x27;whales&#x27;: space</text><text x="550" y="182" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">whales arrive</text><text x="60" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Prepositional phrases attach to many earlier words.</text><text x="60" y="266" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Each extra PP multiplies the ambiguity.</text><text x="60" y="292" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#5A5A52" text-anchor="start" font-weight="normal">Human language: global ambiguity. Code: local ambiguity.</text></svg>