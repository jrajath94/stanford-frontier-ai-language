<text x="320" y="138.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">Adam challenged. Muon / MuonClip (Kimi K2).</text>
<text x="320" y="166.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">may become the standard</text>
<rect x="60" y="206" width="220" height="80" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="246.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Normalization</text>
<text x="320" y="234.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">post -&gt; pre. layer -&gt; RMSNorm.</text>
<text x="320" y="262.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">location and type both move</text>
<rect x="60" y="302" width="220" height="80" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="342.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Attention</text>
<text x="320" y="330.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">per-layer variants, not one design</text>
