<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Pairwise data cancels the user</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Rasch for one user implies Bradley-Terry.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="440" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="8" height="220" rx="4" fill="#1E4D8C"/><text x="84" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Rasch (item-wise)</text><text x="84" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p(Yij = 1) = sigma(Ui + Vj)</text><text x="84" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">user appetite Ui</text><text x="84" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">item appeal Vj</text><rect x="620" y="160" width="440" height="220" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="160" width="8" height="220" rx="4" fill="#1F7A72"/><text x="644" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Bradley-Terry (pairwise)</text><text x="644" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p(j &gt; k) = sigma(Vj - Vk)</text><text x="644" y="242" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Ui cancels in the difference</text><text x="644" y="266" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">only item gaps survive</text><line x1="500" y1="270" x2="620" y2="270" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,270 l-11,-4.5 M620,270 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="257.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="275.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">compare j vs k</text><rect x="60" y="420" width="1000" height="90" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="452" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Key insight: pairwise data reveals only item differences Vj - Vk. It cannot tell an enthusiastic world</text><text x="84" y="478" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">from a selective world. Item-wise data reveals both Ui and Vj.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 1.6.2 derivation, original plate. Shell 4: the cancellation.</text></svg>