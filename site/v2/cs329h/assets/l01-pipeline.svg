<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The preference learning pipeline</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Three stages turn human judgments into an aligned model.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="200" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">1. Collect pairs</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">prompt x</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">two answers y1, y2</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">human picks winner</text><rect x="410" y="170" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="170" width="8" height="200" rx="4" fill="#1E4D8C"/><text x="434" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">2. Train reward model</text><text x="434" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">fit r(x, y)</text><text x="434" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Bradley-Terry fit</text><text x="434" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">r_w &gt; r_l on pairs</text><rect x="760" y="170" width="300" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="170" width="8" height="200" rx="4" fill="#C46B2C"/><text x="784" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">3. Optimize policy</text><text x="784" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">policy pi_theta</text><text x="784" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">maximize reward</text><text x="784" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">stay near reference</text><line x1="360" y1="270.0" x2="410" y2="270.0" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,270.0 l-11,-4.5 M410,270.0 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="313.0" y="257.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="385.0" y="275.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">annotators</text><line x1="710" y1="270.0" x2="760" y2="270.0" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,270.0 l-11,-4.5 M760,270.0 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="663.0" y="257.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="735.0" y="275.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">preferences</text><text x="60" y="430" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">RLHF in one line: learn what humans want, then optimize it.</text><text x="60" y="458" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">DPO skips stage 2: it optimizes the policy on pairs directly.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 1.2, original plate. Shell 2: the three stages.</text></svg>