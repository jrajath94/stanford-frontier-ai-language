<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<defs><marker id="ah-l03-llm-def" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l03-llm-def" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">What makes a language model large</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 3. A large LM = next-token probabilities at scale.</text>
<rect x="60" y="120" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="160.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="24" font-weight="600" fill="#1B2838" dominant-baseline="middle">P(x_t | x_1 ... x_{t-1})</text>
<text x="480" y="200.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">The model outputs a probability for every possible next token.</text>
<rect x="60" y="260" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="302.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Parameters</text>
<text x="520" y="290.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1F7A72" dominant-baseline="middle">hundreds of billions</text>
<text x="520" y="318.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">More weights, more capacity.</text>
<rect x="60" y="360" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="402.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Training tokens</text>
<text x="520" y="390.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1F7A72" dominant-baseline="middle">hundreds of billions to tens of trillions</text>
<text x="520" y="418.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">More text seen, more knowledge.</text>
<rect x="60" y="460" width="840" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="502.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Architecture</text>
<text x="520" y="490.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1F7A72" dominant-baseline="middle">&gt;90% decoder-only transformers</text>
<text x="520" y="518.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">The GPT pattern won.</text>
<text x="944" y="586" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>