<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Beyond pairwise preferences</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">More than pairwise: KTO, k-wise, fine-grained</text><rect x="60" y="90" width="640" height="70" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="90" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="bold" font-weight="normal">KTO (Stanford)</text><text x="300" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">one-sided: yes/no feedback</text><text x="300" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="start" font-weight="normal">customer support style</text><rect x="60" y="172" width="640" height="70" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="90" y="202" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="bold" font-weight="normal">Starling</text><text x="300" y="202" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">k-wise: 5-9 answers per prompt</text><text x="300" y="226" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="start" font-weight="normal">ranking loss</text><rect x="60" y="254" width="640" height="70" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="90" y="284" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="bold" font-weight="normal">SteerLM (Nvidia)</text><text x="300" y="284" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">fine-grained: conciseness,</text><text x="300" y="308" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="start" font-weight="normal">helpfulness, honesty</text><text x="60" y="322" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">&quot;All of social choice needs to get condensed into these things.&quot;</text></svg>