<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>T12 implant: four microelectrode arrays</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">T12: four arrays, two brain regions</text><rect x="60" y="90" width="300" height="120" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">motor cortex x2</text><text x="210" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">carries phoneme</text><text x="210" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">and word information</text><rect x="400" y="90" width="300" height="120" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">Broca&#x27;s area x2</text><text x="550" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">not much above chance</text><text x="550" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">for this decoding</text><text x="60" y="255" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Real-time speech-to-text brain-computer interface.</text><text x="60" y="281" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Decode where the signal lives: motor cortex, not Broca&#x27;s.</text></svg>