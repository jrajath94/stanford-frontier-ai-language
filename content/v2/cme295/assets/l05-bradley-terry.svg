<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l05-bradley-terry" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l05-bradley-terry" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Reward model: Bradley-Terry</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 5. Train pairwise, use pointwise.</text>
<rect x="60" y="120" width="840" height="120" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="158.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="24" font-weight="600" fill="#1B2838" dominant-baseline="middle">P(y_i succeeds y_j) = sigma(r_i - r_j)</text>
<text x="480" y="200.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Probability i is preferred = sigmoid of the score gap.</text>
<rect x="60" y="280" width="400" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="316.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Training</text>
<text x="260" y="345.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">pairwise: (chosen, rejected)</text>
<text x="260" y="363.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">loss = -E[log sigma(r_w - r_l)]</text>
<rect x="500" y="280" width="400" height="160" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="316.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Inference</text>
<text x="700" y="345.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">pointwise: one text in</text>
<text x="700" y="363.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">one score out</text>
<text x="700" y="410.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">subtle and important</text>
<rect x="60" y="490" width="840" height="70" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="525.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Tens of thousands of pairs. RewardBench measures reward models. Dims: useful, friendly, safe.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>