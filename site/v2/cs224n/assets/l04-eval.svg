<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Evaluating dependency parses</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="19" fill="#2B2B2B" text-anchor="middle" font-weight="bold">&quot;She saw the video lecture&quot;: 80% unlabeled, 40% labeled</text><rect x="60" y="80" width="300" height="120" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">Unlabeled accuracy</text><text x="210" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="normal">4 of 5 arcs right</text><text x="210" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="24" fill="#1F7A6D" text-anchor="middle" font-weight="bold">80%</text><rect x="400" y="80" width="300" height="120" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">Labeled accuracy</text><text x="550" y="142" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="normal">2 of 5 labels right</text><text x="550" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="24" fill="#D96830" text-anchor="middle" font-weight="bold">40%</text><text x="60" y="245" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Count the arcs you got right. Then count the labels too.</text></svg>