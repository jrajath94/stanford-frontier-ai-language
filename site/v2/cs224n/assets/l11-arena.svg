<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Chatbot Arena</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Chatbot Arena: 200,000 human votes</text><rect x="60" y="100" width="300" height="100" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">pairwise votes</text><text x="210" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">which answer is better?</text><text x="210" y="180" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">200,000 votes</text><rect x="400" y="100" width="300" height="100" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">Elo ratings</text><text x="550" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">chess-style ranking</text><text x="550" y="180" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">live leaderboard</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Pairwise, like Bradley-Terry: humans compare, Elo ranks.</text></svg>