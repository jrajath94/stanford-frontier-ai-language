<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l04-flash-numbers" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-flash-numbers" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">FlashAttention: the memory hierarchy is the argument</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. FLOPs are free. Bytes are expensive.</text>
<rect x="60" y="120" width="400" height="200" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="160.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">HBM: 80 GB</text>
<text x="260" y="191.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~3.35 TB/s</text>
<text x="260" y="209.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~hundreds of cycles</text>
<rect x="500" y="120" width="400" height="200" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="160.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">SRAM: ~50 MB</text>
<text x="700" y="191.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~19 TB/s</text>
<text x="700" y="209.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~tens of cycles</text>
<rect x="60" y="360" width="840" height="200" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="400.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Naive: write the N x N score matrix to HBM, read it back. Per head, per layer.</text>
<text x="480" y="440.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Flash: stream blocks through SRAM, running softmax, write only the output.</text>
<text x="480" y="480.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1F7A72" dominant-baseline="middle">~10x fewer HBM accesses. Exact, not approximate. Every fast kernel is a byte-saving kernel.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>