<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"><title>Language model definition</title><rect width="760" height="280" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">A language model scores every next word</text><rect x="60" y="90" width="640" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="middle" font-weight="normal">&quot;the cat sat on the ___&quot;  -&gt;  P(word | history)</text><line x1="380" y1="150" x2="380" y2="185" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,185 371,181 371,189" fill="#2B2B2B"/><rect x="230" y="185" width="300" height="50" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="216" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">mat: 0.4, rug: 0.2, moon: 0.001, ...</text><text x="60" y="262" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Leads to BERT, GPT-3, ChatGPT. Everything downstream is LM.</text></svg>