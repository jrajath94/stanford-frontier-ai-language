<text x="480" y="468.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Why: gradients flow cleanly through the residual stream. Training is stable at depth.</text>
<text x="480" y="504.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">RMSNorm: normalize by root-mean-square only. Fewer parameters than layer norm.</text>
