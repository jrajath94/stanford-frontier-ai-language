<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">The KL leash: beta sets the exchange rate</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 5. The policy spends KL where reward is highest.</text>
<rect x="60" y="120" width="840" height="200" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="165.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">penalty = beta x KL(pi || pi_ref), paid per token</text>
<text x="480" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">toy: policy 0.5 vs reference 0.4 -&gt; token KL 0.11 -&gt; penalty 0.011 at beta = 0.1</text>
<text x="480" y="255.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">small per token, everywhere per sequence: drift everywhere, pay everywhere</text>
<rect x="60" y="360" width="400" height="200" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="400.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">beta = 0.1</text>
<text x="260" y="431.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">lenient</text>
<text x="260" y="449.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">policy can improve</text>
<rect x="500" y="360" width="400" height="200" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="400.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">beta = 0.5</text>
<text x="700" y="422.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">strict</text>
<text x="700" y="440.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">policy cannot hack</text>
<text x="700" y="458.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">but cannot improve either</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
