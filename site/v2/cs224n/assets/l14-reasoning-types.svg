<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Three kinds of reasoning</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Deductive, inductive, abductive</text><rect x="60" y="90" width="640" height="70" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="90" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="bold" font-weight="normal">deductive</text><text x="230" y="120" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">all mammals have kidneys; all whales are mammals;</text><text x="230" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="bold">-&gt; all whales have kidneys</text><rect x="60" y="172" width="640" height="70" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="90" y="202" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="bold" font-weight="normal">inductive</text><text x="230" y="202" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">creature with wings; </text><text x="230" y="226" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="bold">-&gt; likely a bird</text><rect x="60" y="254" width="640" height="70" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="90" y="284" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="bold" font-weight="normal">abductive</text><text x="230" y="284" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="normal">car won&#x27;t start; puddle underneath;</text><text x="230" y="308" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="start" font-weight="bold">-&gt; radiator leak?</text><text x="60" y="322" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#5A5A52" text-anchor="start" font-weight="normal">This lecture: informal deductive reasoning.</text></svg>