<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Autograd as Lego blocks</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Autograd: plug blocks together like Lego</text><rect x="40" y="100" width="130" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="105" y="136" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#1F7A6D" text-anchor="middle" font-weight="bold">matmul</text><line x1="170" y1="130" x2="210" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="210,130 201,126 201,134" fill="#5A5A52"/><rect x="210" y="100" width="130" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="275" y="136" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#D96830" text-anchor="middle" font-weight="bold">sigmoid</text><line x1="340" y1="130" x2="380" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="380,130 371,126 371,134" fill="#5A5A52"/><rect x="380" y="100" width="130" height="60" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="445" y="136" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2E6BE6" text-anchor="middle" font-weight="bold">softmax</text><line x1="510" y1="130" x2="550" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="550,130 541,126 541,134" fill="#5A5A52"/><rect x="550" y="100" width="130" height="60" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="615" y="136" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#7C5CBF" text-anchor="middle" font-weight="bold">loss</text><line x1="680" y1="130" x2="720" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="720,130 711,126 711,134" fill="#5A5A52"/><text x="40" y="210" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Each block knows its own backward rule.</text><text x="40" y="236" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Compose blocks freely. Gradients compose too.</text><text x="40" y="262" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">New layer? Verify with numeric gradient checking.</text></svg>