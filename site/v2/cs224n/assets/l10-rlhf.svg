<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img"><title>RLHF pipeline</title><rect width="760" height="360" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">RLHF: tune, model preferences, optimize</text><rect x="40" y="90" width="210" height="100" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="145" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">SFT</text><text x="145" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">instruction</text><text x="145" y="164" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">tune</text><line x1="250" y1="140" x2="290" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="290,140 281,136 281,144" fill="#5A5A52"/><rect x="280" y="90" width="210" height="100" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="385" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">reward model</text><text x="385" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">Bradley-Terry</text><text x="385" y="164" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">P = sig(r1-r2)</text><line x1="490" y1="140" x2="530" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="530,140 521,136 521,144" fill="#5A5A52"/><rect x="520" y="90" width="210" height="100" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="625" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">RL</text><text x="625" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">optimize +</text><text x="625" y="164" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">KL penalty</text><line x1="730" y1="140" x2="770" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="770,140 761,136 761,144" fill="#5A5A52"/><text x="40" y="235" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Pairwise preferences: human judgments are noisy.</text><text x="40" y="261" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Reward hacking: optimizing a learned metric breeds gibberish.</text><text x="40" y="287" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Authoritative beats truthful. Longer beats shorter (turker bias).</text><text x="40" y="313" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">KL penalty keeps the policy near the reference.</text></svg>