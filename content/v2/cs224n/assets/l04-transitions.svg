<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Transition-based parsing with stack and buffer</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Three actions build the tree</text><rect x="60" y="90" width="200" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="160" y="114" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="17" fill="#1F7A6D" text-anchor="middle" font-weight="bold">SHIFT</text><text x="160" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">push buffer word</text><rect x="280" y="90" width="200" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="114" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="17" fill="#D96830" text-anchor="middle" font-weight="bold">LEFT-ARC</text><text x="380" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">arc: stack top is head</text><rect x="500" y="90" width="200" height="60" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="600" y="114" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="17" fill="#2E6BE6" text-anchor="middle" font-weight="bold">RIGHT-ARC</text><text x="600" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">arc: buffer word is head</text><rect x="80" y="190" width="240" height="110" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="200" y="214" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">stack</text><text x="200" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">partial tree</text><text x="200" y="264" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">top two words</text><rect x="440" y="190" width="240" height="110" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="560" y="214" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="bold">buffer</text><text x="560" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">remaining words</text><text x="560" y="264" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">first word</text><text x="60" y="322" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Greedy: pick the best action each step. Linear time. Trained by an oracle.</text></svg>