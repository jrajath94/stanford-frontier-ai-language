<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Precision formats</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Precision: bytes, range, and scalers</text><rect x="60" y="90" width="640" height="60" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="90" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="bold" font-weight="normal">fp32</text><text x="200" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">4 bytes/param</text><text x="400" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">full range</text><rect x="60" y="162" width="640" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="90" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="bold" font-weight="normal">fp16</text><text x="200" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">2 bytes/param</text><text x="400" y="200" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">narrow range: needs grad scalers</text><rect x="60" y="234" width="640" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="90" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="bold" font-weight="normal">bf16</text><text x="200" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">2 bytes/param</text><text x="400" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">8 exponent bits: fp32 range, no scalers</text><text x="60" y="306" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">bf16 needs Ampere or newer: H100, A100, A6000.</text></svg>