<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Word analogy parallelogram</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">king - man + woman = queen</text><circle cx="180" cy="120" r="9" fill="#2E6BE6"/><text x="196" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">king</text><circle cx="180" cy="220" r="9" fill="#2E6BE6"/><text x="196" y="226" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">man</text><circle cx="480" cy="220" r="9" fill="#2E6BE6"/><text x="496" y="226" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">woman</text><circle cx="480" cy="120" r="9" fill="#2E6BE6"/><text x="496" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="bold">queen</text><line x1="180" y1="120" x2="180" y2="220" stroke="#5A5A52" stroke-width="2"/><line x1="480" y1="120" x2="480" y2="220" stroke="#5A5A52" stroke-width="2"/><line x1="180" y1="120" x2="480" y2="120" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="180" y1="220" x2="480" y2="220" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="300" y1="240" x2="360" y2="240" stroke="#1F7A6D" stroke-width="2"/><polygon points="360,240 351,236 351,244" fill="#1F7A6D"/><text x="150" y="268" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Same offset means same relation: gender, royalty.</text><text x="150" y="292" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">&quot;I cheated. I only showed you ones that work.&quot;</text></svg>