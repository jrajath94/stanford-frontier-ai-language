<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Howard&#x27;s story</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Howard: 21, stroke, locked-in</text><rect x="60" y="90" width="200" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="160" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">severe stroke</text><text x="160" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">age 21</text><text x="160" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">locked-in</text><rect x="280" y="90" width="200" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">letter board</text><text x="380" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">gaze selects letters</text><text x="380" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">minutes per sentence</text><rect x="500" y="90" width="200" height="110" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="600" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">eye-tracking</text><text x="600" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">tiring all day</text><text x="600" y="172" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">hard to move eyes</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The motivation: restore effortless communication.</text></svg>