<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Mixed-precision memory per parameter</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Training memory: 16 bytes per parameter</text><rect x="24" y="90" width="136" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="92" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">params</text><text x="92" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">fp16</text><text x="92" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">2 bytes</text><rect x="168" y="90" width="136" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="236" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">grads</text><text x="236" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">fp16</text><text x="236" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">2 bytes</text><rect x="312" y="90" width="136" height="110" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">master</text><text x="380" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">fp32</text><text x="380" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">4 bytes</text><rect x="456" y="90" width="136" height="110" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="524" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">momentum</text><text x="524" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">fp32</text><text x="524" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#7C5CBF" text-anchor="middle" font-weight="bold">4 bytes</text><rect x="600" y="90" width="136" height="110" fill="#FFFFFF" stroke="#3D8B4F" stroke-width="2" rx="10"/><text x="668" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">variance</text><text x="668" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="bold">fp32</text><text x="668" y="178" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#3D8B4F" text-anchor="middle" font-weight="bold">4 bytes</text><text x="24" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">2 + 2 + 4 + 4 + 4 = 16 bytes per parameter, on every GPU.</text><text x="24" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Optimizer states dominate. Sharding them is the first win.</text><text x="24" y="302" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Gradient checkpointing trades compute for activation memory.</text></svg>