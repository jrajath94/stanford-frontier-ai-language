<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The inversion problem</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Behavior is observed. Preferences are inferred. The gap is the danger.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="440" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="170" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">observed behavior</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">clicks, choices, labels</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">what people DID</text><rect x="620" y="170" width="440" height="170" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="170" width="8" height="170" rx="4" fill="#1F7A72"/><text x="644" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">inferred preference</text><text x="644" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">what people WANT</text><text x="644" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">what the system should do</text><line x1="500" y1="255" x2="620" y2="255" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,255 l-11,-4.5 M620,255 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="242.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="260.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">invert</text><rect x="60" y="380" width="1000" height="120" rx="8" fill="#F9E9E4" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="414" font-size="15" font-weight="450" fill="#8A2A1B" text-anchor="start">Inversion fails when: choices reflect errors not wants (bounded rationality),</text><text x="84" y="442" font-size="15" font-weight="450" fill="#8A2A1B" text-anchor="start">options were constrained, or annotators optimized for the wrong target.</text><text x="84" y="470" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Value alignment (Weber, L06): align to informed preferences, not raw clicks.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 5.7 and transcript L06. Shell 4: the gap.</text></svg>