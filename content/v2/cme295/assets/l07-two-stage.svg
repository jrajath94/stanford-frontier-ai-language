<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l07-two-stage" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-two-stage" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Retrieval in two stages</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. Borrowed from search and recommenders.</text>
<rect x="60" y="130" width="400" height="260" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">1. Candidate retrieval</text>
<text x="260" y="197.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">bi-encoder: embed query,</text>
<text x="260" y="215.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">embed chunks, cosine sim</text>
<text x="260" y="280.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1F7A72" dominant-baseline="middle">millions -&gt; ~100</text>
<text x="260" y="316.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">goal: recall. ANN index.</text>
<rect x="500" y="130" width="400" height="260" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="166.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">2. Rerank</text>
<text x="700" y="197.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">cross-encoder: query + chunk</text>
<text x="700" y="215.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">together, one score</text>
<text x="700" y="280.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1F7A72" dominant-baseline="middle">~100 -&gt; top k</text>
<text x="700" y="316.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">goal: precision. costs more.</text>
<line x1="460" y1="260" x2="500" y2="260" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-two-stage)"/>
<rect x="60" y="440" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="478.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Bi-encoder: fast, no interaction. Cross-encoder: slow, full attention between query and chunk.</text>
<text x="480" y="514.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Sentence-BERT: the recommended read for training bi-encoders.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>