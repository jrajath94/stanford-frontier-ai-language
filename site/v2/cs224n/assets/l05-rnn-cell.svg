<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>One RNN cell, one weight set</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">RNN: one weight set, reused every step</text><rect x="60" y="100" width="150" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="135" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="17" fill="#1F7A6D" text-anchor="middle" font-weight="bold">x_t</text><text x="135" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">word vector</text><rect x="305" y="100" width="150" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="126" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="17" fill="#D96830" text-anchor="middle" font-weight="bold">h_{t-1}</text><text x="380" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">memory</text><line x1="210" y1="130" x2="260" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="260,130 251,126 251,134" fill="#5A5A52"/><line x1="305" y1="130" x2="260" y2="130" stroke="#5A5A52" stroke-width="2"/><polygon points="260,130 251,126 251,134" fill="#5A5A52"/><rect x="260" y="190" width="240" height="70" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="380" y="218" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2E6BE6" text-anchor="middle" font-weight="bold">tanh(W_h h_{t-1} + W_e x_t + b)</text><text x="380" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">same W every step</text><line x1="380" y1="260" x2="380" y2="295" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,295 371,291 371,299" fill="#2B2B2B"/><text x="380" y="318" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">h_t: new memory</text></svg>