<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l06-length-bias" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l06-length-bias" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Length bias: GRPO rewards long failures</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 6. The 1/|o_i| term. Fixed by DAPO and Dr. GRPO.</text>
<rect x="60" y="120" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="158.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">token weight ~ 1 / |output length|</text>
<text x="480" y="198.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Tokens in short outputs count more than tokens in long ones.</text>
<rect x="60" y="270" width="400" height="150" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="306.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Negative advantage</text>
<text x="260" y="337.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">short bad output:</text>
<text x="260" y="355.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">downweighted MORE</text>
<text x="260" y="396.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#C46B2C" dominant-baseline="middle">model prefers long bad outputs</text>
<rect x="500" y="270" width="400" height="150" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="306.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Fixes</text>
<text x="700" y="337.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">DAPO: equalize token weights</text>
<text x="700" y="355.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Dr. GRPO: drop the term</text>
<text x="700" y="396.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">wrong answers get shorter</text>
<text x="480" y="480.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Also: clip-higher uses asymmetric epsilon. Low-prob tokens need room to grow.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>