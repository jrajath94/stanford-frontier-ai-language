<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Human-centered design for preference systems</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Build with the people you model.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#1E4D8C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">understand</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">who are the users</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">what do they need</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">context of use</text><rect x="410" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="434" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">prototype</text><text x="434" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">cheap versions first</text><text x="434" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">test with humans</text><text x="434" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">watch real use</text><rect x="760" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="784" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">iterate</text><text x="784" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">measure, learn</text><text x="784" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">redesign</text><text x="784" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">repeat</text><line x1="360" y1="265" x2="410" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,265 l-11,-4.5 M410,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><line x1="710" y1="265" x2="760" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,265 l-11,-4.5 M760,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><text x="60" y="410" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">For preference learning: elicitation interfaces shape the data. Design the question, not just the model.</text><text x="60" y="438" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Guest framing: HCI methods meet the preference pipeline (transcript L05).</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: transcript L05 and textbook ch 4. Original plate. Shell 2: the loop.</text></svg>