<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Dueling bandits: no scores, only winners</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Two arms enter, one comparison leaves.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="140" y="220" width="160" height="56" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="220.0" y="253.0" font-size="16" font-weight="500" fill="#1B2838" text-anchor="middle">arm A</text><rect x="820" y="220" width="160" height="56" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="1.5"/><text x="900.0" y="253.0" font-size="16" font-weight="500" fill="#1B2838" text-anchor="middle">arm B</text><line x1="320" y1="248" x2="800" y2="248" stroke="#1E4D8C" stroke-width="1.5"/><path d="M800,248 l-11,-4.5 M800,248 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="235.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="253.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">duel</text><rect x="420" y="180" width="280" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="560" y="232" font-size="22" font-weight="600" fill="#1B2838" text-anchor="middle">A &gt; B ?</text><text x="560" y="264" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="middle">one bit of feedback</text><text x="60" y="360" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Use when absolute ratings are hard but relative judgments are easy: which robot gait looks more natural?</text><text x="60" y="388" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Goal: find the Condorcet winner (beats all others) with as few duels as possible.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 3.5, original plate. Shell 3: the duel.</text></svg>