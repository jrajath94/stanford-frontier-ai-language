<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l08-elo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l08-elo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Elo, worked: 200 points means 76% expected wins</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 8. Bradley-Terry fits the ratings by maximum likelihood.</text>
<rect x="60" y="120" width="840" height="200" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="165.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="20" font-weight="600" fill="#1B2838" dominant-baseline="middle">E[A beats B] = 1 / (1 + 10^((R_B - R_A)/400))</text>
<text x="480" y="210.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" font-weight="450" fill="#1B2838" dominant-baseline="middle">A = 1200, B = 1000: 1 / (1 + 10^(-0.5)) = 0.76</text>
<text x="480" y="255.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">A wins: 1200 + 32 x (1 - 0.76) = 1207.7. B falls symmetrically.</text>
<rect x="60" y="360" width="400" height="200" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="400.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Elo</text>
<text x="260" y="431.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">update per match</text>
<text x="260" y="449.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">online, simple</text>
<rect x="500" y="360" width="400" height="200" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="400.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">Bradley-Terry</text>
<text x="700" y="431.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">P(A beats B) = sigma(r_A - r_B)</text>
<text x="700" y="449.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">fit all ratings at once</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>