<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l02-kv-bytes" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l02-kv-bytes" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">KV cache bytes: GQA's 4x saving, counted</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 2. Llama-3-style 70B, 80 layers, fp16, GQA with 8 KV heads.</text>
<rect x="60" y="120" width="840" height="250" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="160.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">per token per layer: 2 (K,V) x 8 KV heads x 128 dim x 2 bytes = 4,096 bytes</text>
<text x="480" y="205.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">per token, 80 layers: 327,680 bytes = 320 KB</text>
<text x="480" y="250.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">32,768 tokens x 320 KB = 10.0 GiB per request (GQA, 8 KV heads)</text>
<text x="480" y="295.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#C46B2C" dominant-baseline="middle">MHA with 64 KV heads: 8x the cache = 80 GiB per request</text>
<text x="480" y="335.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1F7A72" dominant-baseline="middle">MQA with 1 KV head: 8x smaller = 1.25 GiB per request</text>
<rect x="60" y="410" width="840" height="150" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="450.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Decision rule: the cache, not the weights, sets max batch size.</text>
<text x="480" y="490.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">100 concurrent 32K requests need 1 TiB with GQA. Halve to 4 heads and it is 5.0 GiB.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>