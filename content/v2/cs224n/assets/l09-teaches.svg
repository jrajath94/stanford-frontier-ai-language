<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>What pretraining teaches</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">One objective teaches many things</text><rect x="30" y="90" width="220" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="140" y="124" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">trivia</text><text x="140" y="152" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">Stanford -&gt; Palo Alto</text><rect x="270" y="90" width="220" height="90" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="124" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">syntax</text><text x="380" y="152" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">&quot;put ____ fork&quot;</text><rect x="510" y="90" width="220" height="90" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="620" y="124" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">coreference</text><text x="620" y="152" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">&quot;over ____ shoulder&quot;</text><rect x="30" y="200" width="220" height="90" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="140" y="234" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">semantics</text><text x="140" y="262" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">ocean words</text><rect x="270" y="200" width="220" height="90" fill="#FFFFFF" stroke="#3D8B4F" stroke-width="2" rx="10"/><text x="380" y="234" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">sentiment</text><text x="380" y="262" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">&quot;the movie was ____&quot;</text><rect x="510" y="200" width="220" height="90" fill="#FFFFFF" stroke="#E8A93D" stroke-width="2" rx="10"/><text x="620" y="234" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">world model</text><text x="620" y="262" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">Zuko, kitchen</text><text x="30" y="322" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Plus surprises: Fibonacci. The model learns more than the objective asks.</text></svg>