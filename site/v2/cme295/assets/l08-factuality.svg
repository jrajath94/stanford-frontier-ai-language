<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l08-factuality" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l08-factuality" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Factuality: check fact by fact</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 8. Binary per fact, weighted aggregate. Example scores 0.6.</text>
<rect x="60" y="150" width="240" height="180" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="196.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">1. Extract</text>
<text x="180" y="237.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">LLM splits text</text>
<text x="180" y="255.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">into facts</text>
<line x1="300" y1="240" x2="340" y2="240" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l08-factuality)"/>
<rect x="340" y="150" width="240" height="180" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="460" y="196.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">2. Check each</text>
<text x="460" y="237.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">RAG / web search</text>
<text x="460" y="255.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">correct or not</text>
<line x1="580" y1="240" x2="620" y2="240" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l08-factuality)"/>
<rect x="620" y="150" width="240" height="180" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="740" y="196.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="19" font-weight="600" fill="#1B2838" dominant-baseline="middle">3. Aggregate</text>
<text x="740" y="237.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">weighted mean</text>
<text x="740" y="255.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">of binaries</text>
<rect x="60" y="390" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="428.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">"Teddy bears, first created in the 1920s..." -&gt; 4 facts, 2 wrong.</text>
<text x="480" y="466.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Wrong: 1920s (it was 1900s). Wrong: the president proudly wanted to shoot (he refused).</text>
<rect x="60" y="540" width="840" height="56" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="568.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Weights alpha_i let important facts count more. Nuance without hand-waving.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>