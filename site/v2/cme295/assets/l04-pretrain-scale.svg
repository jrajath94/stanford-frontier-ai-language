<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<defs><marker id="ah-l04-pretrain-scale" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-pretrain-scale" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Pre-training: the most expensive step</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. Next-token prediction on the internet.</text>
<rect x="60" y="110" width="240" height="84" rx="12" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Common Crawl</text>
<text x="340" y="140.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">~3B pages / month</text>
<text x="340" y="170.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">raw web text</text>
<rect x="60" y="210" width="240" height="84" rx="12" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="252.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">GPT-3</text>
<text x="340" y="240.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">300B tokens</text>
<text x="340" y="270.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">2020 scale</text>
<rect x="60" y="310" width="240" height="84" rx="12" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="352.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Llama 3</text>
<text x="340" y="340.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">15T tokens</text>
<text x="340" y="370.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">2024 scale, 50x GPT-3</text>
<rect x="60" y="440" width="840" height="100" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="476.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Cost: millions to hundreds of millions of dollars per run.</text>
<text x="480" y="510.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Side effects: knowledge cutoff. Editing knowledge later is hard. Plagiarism risk.</text>
<text x="944" y="586" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
