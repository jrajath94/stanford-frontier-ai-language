<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
<defs><marker id="ah-l03-guided-decoding" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l03-guided-decoding" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Guided decoding: force the shape</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 3. Constrain sampling to valid tokens: JSON, FSM, grammar.</text>
<rect x="60" y="200" width="220" height="56" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="170.0" y="228.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">"name": "</text>
<line x1="280" y1="228" x2="340" y2="228" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l03-guided-decoding)"/>
<rect x="340" y="140" width="280" height="176" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="176.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Allowed next tokens</text>
<text x="480" y="207.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">"Alice", "Bob", ...</text>
<text x="480" y="225.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">(not "}" , not "42")</text>
<text x="480" y="280.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">mask the rest to zero</text>
<line x1="620" y1="228" x2="680" y2="228" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l03-guided-decoding)"/>
<rect x="680" y="200" width="220" height="56" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="790.0" y="228.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">"name": "Alice"</text>
<rect x="60" y="380" width="840" height="110" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">The model can only sample tokens the grammar allows. Output always parses.</text>
<text x="480" y="452.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Use it for JSON APIs, code skeletons, form filling.</text>
<text x="944" y="546" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>