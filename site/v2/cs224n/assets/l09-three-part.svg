<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Three-part training</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Three stages: pretrain, continue, fine-tune</text><rect x="40" y="100" width="210" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="145" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">1. pretrain</text><text x="145" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">trillions of words</text><line x1="250" y1="145" x2="290" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="290,145 281,141 281,149" fill="#5A5A52"/><rect x="280" y="100" width="210" height="90" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="385" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">2. continue pretraining</text><text x="385" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">unlabeled task data</text><line x1="490" y1="145" x2="530" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="530,145 521,141 521,149" fill="#5A5A52"/><rect x="520" y="100" width="210" height="90" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="625" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">3. fine-tune</text><text x="625" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">labeled task data</text><line x1="730" y1="145" x2="770" y2="145" stroke="#5A5A52" stroke-width="2"/><polygon points="770,145 761,141 761,149" fill="#5A5A52"/><text x="40" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">&quot;Don&#x27;t Stop Pretraining&quot;: adapt on unlabeled data before fine-tuning.</text><text x="40" y="266" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Fine-tuning starts near the pretrained solution and stays close.</text></svg>