<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l01-bpe" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l01-bpe" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">BPE: merge the most frequent pair, repeat</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 1. Worked on a toy corpus: low low lower.</text>
<text x="480" y="120.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="450" fill="#1B2838" dominant-baseline="middle">corpus: l o w | l o w | l o w e r</text>
<rect x="120" y="170" width="720" height="94" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="217.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">merge 1: e+r -&gt; er</text>
<text x="560" y="217.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">"low", "lower" -&gt; "low", "low er"</text>
<rect x="120" y="280" width="720" height="94" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="327.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">merge 2: er -&gt; ?</text>
<text x="560" y="327.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">keep merging until the vocab budget fills</text>
<rect x="120" y="390" width="720" height="94" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="200" y="437.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">result: "lower" = low + er</text>
<text x="560" y="437.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">common words stay whole; rare words split</text>
<rect x="60" y="510" width="840" height="70" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="545.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Frequent strings become tokens. Rare strings compose from pieces. No word is ever unknown.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>