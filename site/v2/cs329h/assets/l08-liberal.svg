<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Sen's liberal paradox: the prude and the book</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Nosy preferences break even weak liberalism.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="200" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">prude</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">c &gt; a &gt; b</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">prefers no one reads,</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">then reading it herself</text><rect x="600" y="170" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="170" width="8" height="200" rx="4" fill="#C46B2C"/><text x="624" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">lewd</text><text x="624" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">a &gt; b &gt; c</text><text x="624" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">prefers prude reads,</text><text x="624" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">then reading it himself</text><rect x="60" y="410" width="1000" height="100" rx="8" fill="#F9E9E4" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="442" font-size="15" font-weight="600" fill="#8A2A1B" text-anchor="start">Minimal liberalism + Pareto + unrestricted domain are inconsistent when preferences are nosy.</text><text x="84" y="472" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">AI relevance: safety and moderation preferences are nosy by nature. Aggregation must choose.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 5.5 (Sen 1970), original plate. Shell 4: the paradox.</text></svg>