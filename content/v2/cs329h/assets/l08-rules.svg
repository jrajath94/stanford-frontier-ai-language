<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Four voting rules, four philosophies</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Same ballots, different winners.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="250" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="8" height="190" rx="4" fill="#5C6B7A"/><text x="64" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">plurality</text><text x="64" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">top choice only</text><text x="64" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">simple, ignores depth</text><rect x="310" y="170" width="250" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="310" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="334" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Borda</text><text x="334" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">points by rank</text><text x="334" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">uses full ranking</text><rect x="580" y="170" width="250" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="580" y="170" width="8" height="190" rx="4" fill="#1E4D8C"/><text x="604" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">STV</text><text x="604" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">eliminate + transfer</text><text x="604" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">rounds of runoff</text><rect x="850" y="170" width="250" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="850" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="874" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">Condorcet</text><text x="874" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">pairwise champion</text><text x="874" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">may not exist</text><rect x="40" y="400" width="1040" height="110" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="432" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Ballot: A&gt;B&gt;C, A&gt;B&gt;C, B&gt;C&gt;A, C&gt;B&gt;A. Plurality: A wins (2 votes). Borda: B wins (2+2+1+1=6).</text><text x="64" y="462" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Different rules, different winners, same ballots. The rule IS the value choice.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 5.2, original plate. Shell 3: the four rules.</text></svg>