<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"><title>Gradient clipping</title><rect width="760" height="280" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Clip the gradient norm: a crude hack that works</text><rect x="60" y="90" width="200" height="90" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="160" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">gradient g</text><text x="160" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">norm ||g||</text><text x="160" y="166" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">too large?</text><line x1="260" y1="135" x2="310" y2="135" stroke="#2B2B2B" stroke-width="2"/><polygon points="310,135 301,131 301,139" fill="#2B2B2B"/><rect x="310" y="90" width="390" height="90" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="505" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">g = g x limit / ||g||</text><text x="505" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">limit = 5, 10, or 20</text><text x="505" y="166" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">direction kept, size capped</text><text x="60" y="230" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Exploding gradients are easy to see: the loss jumps.</text><text x="60" y="256" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Clip before the update. Keep the direction, cap the size.</text></svg>