<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>The minimal transformer block</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Minimal block, repeated</text><rect x="40" y="100" width="200" height="80" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="140" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">embed +</text><text x="140" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">position</text><line x1="240" y1="140" x2="280" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="280,140 271,136 271,144" fill="#5A5A52"/><rect x="280" y="100" width="200" height="80" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">masked</text><text x="380" y="150" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">self-attention</text><line x1="480" y1="140" x2="520" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="520,140 511,136 511,144" fill="#5A5A52"/><rect x="520" y="100" width="200" height="80" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="620" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">MLP</text><line x1="720" y1="140" x2="760" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="760,140 751,136 751,144" fill="#5A5A52"/><text x="40" y="230" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Add residual connections and layer normalization around each.</text><text x="40" y="256" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Repeat the block. That is the whole architecture.</text><text x="40" y="282" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Her words: this is the minimal thing.</text></svg>