<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>GPT scale ladder</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">GPT: 117M to 175B</text><rect x="40" y="90" width="210" height="100" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="145" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">GPT</text><text x="145" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">117M</text><text x="145" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">BooksCorpus</text><line x1="250" y1="140" x2="290" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="290,140 281,136 281,144" fill="#5A5A52"/><rect x="280" y="90" width="210" height="100" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="385" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">GPT-2</text><text x="385" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">1.5B</text><text x="385" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">~9B words</text><line x1="490" y1="140" x2="530" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="530,140 521,136 521,144" fill="#5A5A52"/><rect x="520" y="90" width="210" height="100" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="625" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">GPT-3</text><text x="625" y="138" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">175B</text><text x="625" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">300B words</text><line x1="730" y1="140" x2="770" y2="140" stroke="#5A5A52" stroke-width="2"/><polygon points="770,140 761,136 761,144" fill="#5A5A52"/><text x="40" y="240" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Chinchilla: GPT-3 was &quot;comically oversized&quot;. Smaller + more data wins.</text><text x="40" y="266" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Cost ~ params x tokens.</text><text x="40" y="292" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">In-context learning: thanks-&gt;merci, hello-&gt;bonjour, otter-&gt;?</text></svg>