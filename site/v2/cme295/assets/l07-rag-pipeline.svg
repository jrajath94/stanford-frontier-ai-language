<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<defs><marker id="ah-l07-rag-pipeline" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-rag-pipeline" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">RAG: retrieve, augment, generate</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. Retrieval Augmented Generation. Relevant is the whole game.</text>
<rect x="60" y="160" width="240" height="170" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1B2838" dominant-baseline="middle">RETRIEVE</text>
<text x="180" y="250.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">find relevant</text>
<text x="180" y="270.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">chunks</text>
<line x1="300" y1="245" x2="340" y2="245" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-rag-pipeline)"/>
<rect x="340" y="160" width="240" height="170" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="460" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1B2838" dominant-baseline="middle">AUGMENT</text>
<text x="460" y="250.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">paste them</text>
<text x="460" y="270.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">into the prompt</text>
<line x1="580" y1="245" x2="620" y2="245" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-rag-pipeline)"/>
<rect x="620" y="160" width="240" height="170" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="740" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="20" font-weight="600" fill="#1B2838" dominant-baseline="middle">GENERATE</text>
<text x="740" y="250.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">LLM answers</text>
<text x="740" y="270.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">with context</text>
<rect x="120" y="400" width="720" height="56" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="480.0" y="428.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">"Who won the local election?" + [retrieved: results article]</text>
<text x="480" y="510.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">The prompt now contains the answer. The LLM just has to read it.</text>
<text x="944" y="586" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>