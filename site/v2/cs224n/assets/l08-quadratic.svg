<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Quadratic attention cost</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Attention costs n-squared</text><text x="60" y="110" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">n = 30</text><rect x="180" y="90" width="90" height="24" fill="#1F7A6D" rx="6"/><text x="285" y="110" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">fine</text><text x="60" y="160" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">n = 50,000</text><rect x="180" y="140" width="520" height="24" fill="#D96830" rx="6"/><text x="710" y="160" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">infeasible</text><text x="60" y="230" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The n-by-n score matrix is the limit.</text><text x="60" y="256" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Verdict: original Transformer + a couple of modifications still best.</text></svg>