<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">GP preference models: smooth rewards</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Nearby points share information through the kernel.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#5C6B7A"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">prior</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">r ~ GP(m, k)</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">RBF kernel</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">lengthscale l</text><text x="84" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">smoothness knob</text><rect x="410" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="410" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="434" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">data</text><text x="434" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">pairwise wins</text><text x="434" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">BT likelihood</text><text x="434" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">on function values</text><rect x="760" y="170" width="300" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="760" y="170" width="8" height="190" rx="4" fill="#1E4D8C"/><text x="784" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">posterior</text><text x="784" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">mean + bands</text><text x="784" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">uncertainty where</text><text x="784" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">data is thin</text><line x1="360" y1="265" x2="410" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M410,265 l-11,-4.5 M410,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="313.0" y="252.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="385.0" y="270.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">condition</text><line x1="710" y1="265" x2="760" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M760,265 l-11,-4.5 M760,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="663.0" y="252.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="735.0" y="270.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">-&gt;</text><text x="60" y="410" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Linear rewards peak at corners. A GP can prefer the moderate middle: mini-golf speed x angle.</text><text x="60" y="438" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">Cost: O(n^3) without approximations. Use when the reward shape is genuinely nonlinear.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 1.11/2.19, original plate. Shell 3: the posterior.</text></svg>