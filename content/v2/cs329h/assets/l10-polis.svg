<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="620" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Polis and Community Notes: bridging, not majority</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Find notes that survive ideological disagreement.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="1000" height="140" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="200" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">u = mu + alpha_j + beta_j + p^T q_j + noise</text><text x="88" y="232" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">alpha: rater bias.  p^T q: ideological agreement.  beta: quality AFTER ideology is removed.</text><text x="88" y="262" font-size="15" font-weight="600" fill="#1F7A72" text-anchor="start">Select notes with beta_j &gt;= c: rated well by people who disagree with each other.</text><rect x="60" y="340" width="460" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="340" width="8" height="150" rx="4" fill="#C46B2C"/><text x="84" y="372" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">majority voting</text><text x="84" y="398" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">largest group wins</text><text x="84" y="422" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">tyranny of the majority</text><rect x="600" y="340" width="460" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="340" width="8" height="150" rx="4" fill="#1F7A72"/><text x="624" y="372" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">bridging</text><text x="624" y="398" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">cross-partisan appeal</text><text x="624" y="422" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">diverse jury &gt; majority</text><text x="60" y="530" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Guest lecture: Colin Megill, Polis. Community Notes on X runs on this model.</text><text x="40" y="592" font-size="14" fill="#5C6B7A">Source: textbook ch 5.6 eq 5.4 and transcript L07. Shell 5: the application.</text></svg>