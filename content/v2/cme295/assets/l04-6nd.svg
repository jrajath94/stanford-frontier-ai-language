<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l04-6nd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-6nd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">C = 6ND: where the 6 comes from</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. 2 forward + 4 backward, per parameter per token.</text>
<rect x="60" y="120" width="400" height="200" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="160.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">forward: 2 FLOPs</text>
<text x="260" y="196.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">one multiply-add</text>
<text x="260" y="214.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">per parameter</text>
<rect x="500" y="120" width="400" height="200" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="160.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">backward: 4 FLOPs</text>
<text x="700" y="196.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">gradients for activations</text>
<text x="700" y="214.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">+ gradients for weights</text>
<rect x="60" y="360" width="840" height="180" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="400.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">GPT-3: 6 x 175e9 x 300e9 = 3.15e23 FLOPs</text>
<text x="480" y="445.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">10.7 days on 10,000 H100s at fantasy 100% MFU. ~21 days at real 50%.</text>
<text x="480" y="485.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Ignores the attention quadratic term: fine at 2K context, not at 128K.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>