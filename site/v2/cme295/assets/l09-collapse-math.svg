<text x="808" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">gen 3</text>
<text x="808" y="295.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">top 5 dominate</text>
<rect x="60" y="410" width="840" height="150" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="450.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">tail_G3 ~ tail_G1 x c^2, c &lt; 1: rare words and rare facts vanish first.</text>
<text x="480" y="490.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">A diversity catastrophe, not a quality dip. Re-seed the tail: provenance, fresh human data, mid-training.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
