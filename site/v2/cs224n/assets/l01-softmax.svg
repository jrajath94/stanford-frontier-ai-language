<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Softmax over the vocabulary</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Softmax turns scores into probabilities</text><rect x="60" y="90" width="150" height="60" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="135" y="116" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="bold" text-anchor="middle" font-weight="normal">score</text><text x="135" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">u_o . v_c</text><line x1="210" y1="120" x2="260" y2="120" stroke="#2B2B2B" stroke-width="2"/><polygon points="260,120 251,116 251,124" fill="#2B2B2B"/><rect x="260" y="90" width="150" height="60" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="335" y="116" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="bold" text-anchor="middle" font-weight="normal">exp(score)</text><text x="335" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">positive</text><line x1="410" y1="120" x2="460" y2="120" stroke="#2B2B2B" stroke-width="2"/><polygon points="460,120 451,116 451,124" fill="#2B2B2B"/><rect x="460" y="90" width="170" height="60" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="545" y="116" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="bold" text-anchor="middle" font-weight="normal">divide by sum</text><text x="545" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">over all words</text><text x="90" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Dot product: similarity of outside and center vectors.</text><text x="90" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Exponentiation: makes every score positive.</text><text x="90" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Normalize: over the whole vocabulary. Probabilities sum to 1.</text></svg>