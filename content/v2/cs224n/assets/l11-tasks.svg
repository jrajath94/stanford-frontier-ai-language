<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Why evaluate and what tasks look like</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Evaluate for a purpose</text><rect x="60" y="90" width="200" height="110" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="160" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#1F7A6D" text-anchor="middle" font-weight="bold">train</text><text x="160" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">loss</text><text x="160" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">dev: early stopping</text><rect x="280" y="90" width="200" height="110" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">deploy</text><text x="380" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">real world</text><text x="380" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">does it work?</text><rect x="500" y="90" width="200" height="110" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="600" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">publish</text><text x="600" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">reproducible</text><text x="600" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">fast, cheap</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Closed tasks: fewer than 10 answers. Open-ended: anything goes.</text><text x="60" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Academic eval: direction over 10 years matters, not one number.</text></svg>