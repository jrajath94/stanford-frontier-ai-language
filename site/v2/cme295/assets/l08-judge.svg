<text x="480" y="552.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Pairwise mode generates synthetic preference labels for reward models.</text>
