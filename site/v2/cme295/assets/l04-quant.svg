<text x="300" y="228.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">32 bits</text>
<text x="300" y="256.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">weights in mixed precision</text>
<rect x="60" y="294" width="200" height="76" rx="8" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="332.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">FP16 / BF16</text>
<text x="300" y="320.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">16 bits</text>
