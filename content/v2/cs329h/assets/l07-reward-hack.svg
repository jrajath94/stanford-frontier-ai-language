<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Reward hacking</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Optimize the proxy and the true goal can fall.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="1000" height="90" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="206" font-size="16" font-weight="450" fill="#1B2838" text-anchor="start">proxy r(x,y) rises  -&gt;  policy drifts far from reference  -&gt;  true quality falls</text><rect x="60" y="300" width="460" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="300" width="8" height="150" rx="4" fill="#C46B2C"/><text x="84" y="332" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">why it happens</text><text x="84" y="358" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">r is fit on limited pairs</text><text x="84" y="382" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">policy explores off-data</text><text x="84" y="406" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">extrapolation lies</text><rect x="600" y="300" width="460" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="300" width="8" height="150" rx="4" fill="#1F7A72"/><text x="624" y="332" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">defenses</text><text x="624" y="358" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">KL penalty to reference</text><text x="624" y="382" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">iterate the loop</text><text x="624" y="406" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">evaluate, not just fit</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: textbook ch 1.2 step 3, original plate. Shell 4: the gap.</text></svg>