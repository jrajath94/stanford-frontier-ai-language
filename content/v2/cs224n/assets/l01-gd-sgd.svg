<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Gradient descent versus stochastic gradient descent</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="200" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Gradient descent</text><text x="560" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Stochastic gradient descent</text><line x1="60" y1="280" x2="340" y2="280" stroke="#5A5A52" stroke-width="2"/><line x1="200" y1="70" x2="200" y2="280" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="200" y1="90" x2="230" y2="140" stroke="#1F7A6D" stroke-width="3"/><line x1="230" y1="140" x2="215" y2="190" stroke="#1F7A6D" stroke-width="3"/><line x1="215" y1="190" x2="205" y2="235" stroke="#1F7A6D" stroke-width="3"/><line x1="205" y1="235" x2="200" y2="265" stroke="#1F7A6D" stroke-width="3"/><circle cx="200" cy="90" r="5" fill="#1F7A6D"/><circle cx="230" cy="140" r="5" fill="#1F7A6D"/><circle cx="215" cy="190" r="5" fill="#1F7A6D"/><circle cx="205" cy="235" r="5" fill="#1F7A6D"/><circle cx="200" cy="265" r="5" fill="#1F7A6D"/><text x="90" y="305" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">Whole corpus per step. Slow.</text><line x1="420" y1="280" x2="700" y2="280" stroke="#5A5A52" stroke-width="2"/><line x1="560" y1="70" x2="560" y2="280" stroke="#5A5A52" stroke-width="2" stroke-dasharray="6,4"/><line x1="560" y1="90" x2="600" y2="130" stroke="#D96830" stroke-width="3"/><line x1="600" y1="130" x2="540" y2="170" stroke="#D96830" stroke-width="3"/><line x1="540" y1="170" x2="590" y2="200" stroke="#D96830" stroke-width="3"/><line x1="590" y1="200" x2="545" y2="240" stroke="#D96830" stroke-width="3"/><line x1="545" y1="240" x2="560" y2="265" stroke="#D96830" stroke-width="3"/><circle cx="560" cy="90" r="5" fill="#D96830"/><circle cx="600" cy="130" r="5" fill="#D96830"/><circle cx="540" cy="170" r="5" fill="#D96830"/><circle cx="590" cy="200" r="5" fill="#D96830"/><circle cx="545" cy="240" r="5" fill="#D96830"/><circle cx="560" cy="265" r="5" fill="#D96830"/><text x="450" y="305" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="start" font-weight="normal">Sample windows. Fast, noisy. Noise helps.</text></svg>