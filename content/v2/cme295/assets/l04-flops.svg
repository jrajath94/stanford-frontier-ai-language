<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">FLOPs vs FLOPS: work vs speed</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. Capital S matters.</text>
<rect x="80" y="140" width="380" height="220" rx="12" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="270" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="26" font-weight="600" fill="#1B2838" dominant-baseline="middle">FLOPs</text>
<text x="270" y="224.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">floating-point operations</text>
<text x="270" y="258.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Total work.</text>
<text x="270" y="278.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">How big is the job?</text>
<rect x="500" y="140" width="380" height="220" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="690" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="26" font-weight="600" fill="#1B2838" dominant-baseline="middle">FLOPS</text>
<text x="690" y="224.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">operations per second</text>
<text x="690" y="258.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Rate.</text>
<text x="690" y="278.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">How fast is the machine?</text>
<text x="480" y="430.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">H100 80GB: ~34 TFLOPS in FP64. Training = FLOPs / FLOPS, times efficiency.</text>
