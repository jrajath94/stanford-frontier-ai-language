<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="620" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Three shapes of preference data</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Same preferences, three observation types.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="150" width="1000" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="184" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">Full ranking</text><rect x="88" y="198" width="200" height="32" rx="999" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="188.0" y="219.0" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">A &gt; B &gt; C &gt; D</text><text x="320" y="196" font-size="14" font-weight="450" fill="#1F7A72" text-anchor="start">+ most information</text><text x="320" y="222" font-size="14" font-weight="450" fill="#C46B2C" text-anchor="start">- cognitively heavy</text><rect x="60" y="262" width="1000" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="296" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">Choice from set</text><rect x="88" y="310" width="200" height="32" rx="999" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="188.0" y="331.0" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">(B, {A,B,C})</text><text x="320" y="308" font-size="14" font-weight="450" fill="#1F7A72" text-anchor="start">+ realistic</text><text x="320" y="334" font-size="14" font-weight="450" fill="#C46B2C" text-anchor="start">- needs set context</text><rect x="60" y="374" width="1000" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="408" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">Binary pair</text><rect x="88" y="422" width="200" height="32" rx="999" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="188.0" y="443.0" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">Y_AB = 1</text><text x="320" y="420" font-size="14" font-weight="450" fill="#1F7A72" text-anchor="start">+ cheap, fast</text><text x="320" y="446" font-size="14" font-weight="450" fill="#C46B2C" text-anchor="start">- one bit per query</text><rect x="60" y="486" width="1000" height="96" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><text x="88" y="520" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">Item-wise</text><rect x="88" y="534" width="200" height="32" rx="999" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="188.0" y="555.0" font-size="13" font-weight="500" fill="#1B2838" text-anchor="middle">Y_ij in {0,1}</text><text x="320" y="532" font-size="14" font-weight="450" fill="#1F7A72" text-anchor="start">+ abundant</text><text x="320" y="558" font-size="14" font-weight="450" fill="#C46B2C" text-anchor="start">- needs user model</text><text x="40" y="592" font-size="14" fill="#5C6B7A">Source: textbook ch 1.5, original plate. Shell 1: the three shapes.</text></svg>