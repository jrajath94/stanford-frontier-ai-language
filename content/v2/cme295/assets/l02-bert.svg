<text x="24" y="230.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Segment A = sentence 1 (blue). Segment B = sentence 2 (green). Position added to each.</text>
