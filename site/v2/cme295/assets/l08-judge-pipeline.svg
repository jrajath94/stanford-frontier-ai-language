<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<defs><marker id="ah-l08-judge-pipeline" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l08-judge-pipeline" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="680" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">The judge pipeline: rubric to calibrated score</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 8. An uncalibrated judge is a random number generator with good grammar.</text>
<rect x="60" y="140" width="200" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<rect x="140" y="160" width="40" height="40" rx="20" fill="#1F7A72"/>
<text x="160" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">rubric</text>
<text x="160" y="286.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">crisp guidelines</text>
<text x="160" y="303.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">worked examples</text>
<line x1="260" y1="250" x2="276" y2="250" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l08-judge-pipeline)"/>
<rect x="276" y="140" width="200" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<rect x="356" y="160" width="40" height="40" rx="20" fill="#1E4D8C"/>
<text x="376" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">prompt</text>
<text x="376" y="286.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">rationale first</text>
<text x="376" y="303.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">binary, structured</text>
<line x1="476" y1="250" x2="492" y2="250" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l08-judge-pipeline)"/>
<rect x="492" y="140" width="200" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<rect x="572" y="160" width="40" height="40" rx="20" fill="#C46B2C"/>
<text x="592" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">sample</text>
<text x="592" y="286.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">temp 0.1-0.2</text>
<text x="592" y="303.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">multiple for ties</text>
<line x1="692" y1="250" x2="708" y2="250" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l08-judge-pipeline)"/>
<rect x="708" y="140" width="200" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<rect x="788" y="160" width="40" height="40" rx="20" fill="#5C6B7A"/>
<text x="808" y="245.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">de-bias</text>
<text x="808" y="286.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">both orders</text>
<text x="808" y="303.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">length rules</text>
<rect x="60" y="410" width="840" height="200" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="450.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Calibrate: humans grade 200-500 items too. Judge-human kappa must clear ~0.7.</text>
<text x="480" y="490.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Monitor: re-calibrate on a rolling sample. Judges drift as models update. Version them.</text>
<text x="480" y="530.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">The pipeline is judge-at-scale plus human-at-the-margin. The human sample is not optional.</text>
<text x="944" y="666" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>