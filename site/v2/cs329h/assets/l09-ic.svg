<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="560" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Incentive compatibility</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Truth-telling is the best strategy.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="460" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">first-price auction</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">winner pays own bid</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">shade your bid</text><text x="84" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">NOT incentive compatible</text><rect x="600" y="170" width="460" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="624" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">second-price (Vickrey)</text><text x="624" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">winner pays 2nd bid</text><text x="624" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">bid your true value</text><text x="624" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">dominant strategy</text><rect x="60" y="400" width="1000" height="90" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="434" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Values 10, 7, 5. Bidder 1 bids 10, wins, pays 7. Bidding 9 risks losing. Bidding 11 gains nothing.</text><text x="84" y="462" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">For preference learning: IC mechanisms elicit true values, the target we actually want.</text><text x="40" y="532" font-size="14" fill="#5C6B7A">Source: transcript L04 [29:10], textbook ch 5.10, original plate. Shell 3: the two auctions.</text></svg>