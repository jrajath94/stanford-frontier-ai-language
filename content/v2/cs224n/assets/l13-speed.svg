<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Decoding speed versus natural speech</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">60-70 wpm versus 150 wpm natural</text><text x="60" y="110" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">BCI max</text><rect x="180" y="90" width="260" height="24" fill="#1F7A6D" rx="6"/><text x="450" y="110" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">60-70 wpm</text><text x="60" y="160" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">natural</text><rect x="180" y="140" width="600" height="24" fill="#D96830" rx="6"/><text x="790" y="160" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="start" font-weight="normal">150 wpm</text><text x="60" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Half the speed of speech. Far ahead of letter boards.</text><text x="60" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">Writing by hand: 13-14 wpm. Eye-tracking: ~5 wpm.</text></svg>