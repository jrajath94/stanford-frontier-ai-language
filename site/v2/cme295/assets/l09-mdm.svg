<rect x="0" y="0" width="960" height="660" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Masked diffusion LMs: noise = [MASK]</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 9. MDM / DLLM. LLaDA, early 2025. Draft-to-refine, not left-to-right.</text>
<text x="60" y="140.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Forward: mask more and more.</text>
<rect x="60" y="160" width="108" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="114.0" y="182.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">The</text>
<rect x="180" y="160" width="108" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="234.0" y="182.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">bear</text>
<rect x="300" y="160" width="108" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="354.0" y="182.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">is</text>
<rect x="420" y="160" width="108" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="474.0" y="182.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">cute</text>
<line x1="560" y1="182" x2="620" y2="182" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l09-mdm)"/>
<rect x="630" y="160" width="60" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="660.0" y="182.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">[M]</text>
<rect x="700" y="160" width="60" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="730.0" y="182.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">[M]</text>
<rect x="770" y="160" width="60" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="800.0" y="182.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">[M]</text>
<rect x="840" y="160" width="60" height="44" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="870.0" y="182.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" font-weight="500" fill="#1B2838" dominant-baseline="middle">[M]</text>
<text x="60" y="260.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Reverse: unmask all at once, conditioned on the prompt. Repeat for N steps.</text>
<rect x="60" y="310" width="840" height="120" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="348.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Fewer forward passes: N steps, not one per token. ~10x faster on long outputs.</text>
<text x="480" y="388.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">N controls quality. N is far smaller than output length.</text>
<rect x="60" y="480" width="840" height="120" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="516.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Wins: speed, and fill-in-the-middle coding (sees both directions).</text>
<text x="480" y="552.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Catching up to autoregressive, not at the frontier yet. Reasoning for diffusion: open work.</text>
<text x="944" y="646" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>