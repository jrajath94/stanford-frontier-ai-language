<text x="160" y="444.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">translation</text>
<text x="300" y="410.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">F-score x (1 - ordering penalty)</text>
<text x="300" y="444.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#C46B2C" dominant-baseline="middle">limit: synonyms, stems, arbitrary knobs</text>
