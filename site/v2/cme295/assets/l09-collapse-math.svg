<text x="160" y="286.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">100 words</text>
<text x="160" y="303.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Zipf spread</text>
