<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="620" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The red-bus / blue-bus problem</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Clone one option and IIA steals share from the innocent third.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><text x="60" y="160" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">Before: train vs bus</text><rect x="60" y="180" width="440" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="180" width="8" height="150" rx="4" fill="#5C6B7A"/><text x="84" y="212" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">train</text><text x="84" y="238" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">V = 1.0</text><text x="84" y="262" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = 0.269</text><rect x="560" y="180" width="440" height="150" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="560" y="180" width="8" height="150" rx="4" fill="#1F7A72"/><text x="584" y="212" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">bus</text><text x="584" y="238" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">V = 2.0</text><text x="584" y="262" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = 0.731</text><text x="60" y="380" font-size="17" font-weight="600" fill="#1B2838" text-anchor="start">After: split the bus into red and blue</text><rect x="60" y="400" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="400" width="8" height="130" rx="4" fill="#5C6B7A"/><text x="84" y="432" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">train</text><text x="84" y="458" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = 0.155</text><rect x="400" y="400" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="400" y="400" width="8" height="130" rx="4" fill="#C46B2C"/><text x="424" y="432" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">red bus</text><text x="424" y="458" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = 0.422</text><rect x="740" y="400" width="300" height="130" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="740" y="400" width="8" height="130" rx="4" fill="#C46B2C"/><text x="764" y="432" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">blue bus</text><text x="764" y="458" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">p = 0.422</text><rect x="60" y="556" width="1000" height="0" rx="0" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1.5"/><text x="60" y="566" font-size="14" font-weight="450" fill="#8A2A1B" text-anchor="start">The train did nothing wrong, yet its share fell 0.269 -&gt; 0.155. Clones should split the bus share, not take the train's.</text><text x="40" y="592" font-size="14" fill="#5C6B7A">Source: textbook ch 1.8 worked code, original plate. Shell 4: the violation.</text></svg>