<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 2. Post-norm (2017) -&gt; pre-norm. RMSNorm drops the mean.</text>
