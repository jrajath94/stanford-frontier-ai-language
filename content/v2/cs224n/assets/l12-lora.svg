<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>LoRA: low-rank adaptation</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">LoRA: train a low-rank delta</text><rect x="60" y="100" width="640" height="70" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="380" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#7C5CBF" text-anchor="middle" font-weight="bold">W + (alpha/r) x B x A</text><text x="380" y="156" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">B: d x r, A: r x k. Train only A and B.</text><text x="60" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Why: gradients have low intrinsic rank.</text><text x="60" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Apply to attention matrices. r is a slider to full fine-tuning.</text><text x="60" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Merge at inference: no extra latency.</text><text x="60" y="298" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="start" font-weight="normal">PEFT when: batch-1 does not fit, or small data needs generalization.</text></svg>