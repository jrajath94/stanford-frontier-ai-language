<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Seq2seq: two LSTMs for translation</title><rect width="760" height="340" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Seq2seq: encode, then decode</text><rect x="60" y="100" width="200" height="80" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="160" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">encoder LSTM</text><text x="160" y="154" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">reads source</text><line x1="260" y1="140" x2="330" y2="140" stroke="#1F7A6D" stroke-width="2"/><polygon points="330,140 321,136 321,144" fill="#1F7A6D"/><rect x="330" y="100" width="100" height="80" fill="#1F7A6D" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="380" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">final</text><text x="380" y="152" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">state</text><line x1="430" y1="140" x2="500" y2="140" stroke="#1F7A6D" stroke-width="2"/><polygon points="500,140 491,136 491,144" fill="#1F7A6D"/><rect x="500" y="100" width="200" height="80" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="600" y="128" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">decoder LSTM</text><text x="600" y="154" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">writes target</text><text x="60" y="225" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">&quot;he hit me with a pie&quot;: seed the decoder with the encoder state.</text><text x="60" y="251" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Start token begins generation. One end-to-end loss.</text><text x="60" y="277" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">General pattern: summarization, text-to-speech, any seq-to-seq.</text></svg>