<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>One vector per word is a superposition of senses</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Polysemy: senses collapse into one vector</text><rect x="60" y="90" width="260" height="40" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="190" y="116" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">bank: money</text><rect x="440" y="90" width="260" height="40" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="570" y="116" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">bank: river</text><rect x="60" y="142" width="260" height="40" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="190" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">jaguar: car</text><rect x="440" y="142" width="260" height="40" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="570" y="168" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">jaguar: animal</text><rect x="60" y="194" width="260" height="40" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="190" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">jaguar: Mac OS X</text><rect x="440" y="194" width="260" height="40" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="570" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">jaguar: guitar</text><rect x="60" y="246" width="260" height="40" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="190" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">field: crop</text><rect x="440" y="246" width="260" height="40" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="570" y="272" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">field: math</text><text x="60" y="300" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Modern word vectors: ONE vector per word = superposition of senses.</text></svg>