<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Two problems of RNNs</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Why RNNs fell out of favor</text><rect x="60" y="80" width="300" height="130" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="210" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">Sequential</text><text x="210" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">for loop t = 1..T</text><text x="210" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">step t needs step t-1</text><text x="210" y="184" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">cannot parallelize</text><rect x="400" y="80" width="300" height="130" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="550" y="108" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#2E6BE6" text-anchor="middle" font-weight="bold">Forgetting</text><text x="550" y="134" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">memory fades with distance</text><text x="550" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">early context lost</text><text x="550" y="184" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">vanishing gradient</text><text x="60" y="255" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Problem 1 killed RNNs at scale: GPUs sit idle.</text><text x="60" y="281" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Problem 2 motivated LSTMs: protect the memory.</text></svg>