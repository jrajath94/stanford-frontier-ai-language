<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<defs><marker id="ah-l04-lora-family" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-lora-family" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="680" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">The LoRA family: one idea, four budgets</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. The update lives in a small subspace.</text>
<rect x="60" y="110" width="220" height="88" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="154.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">LoRA (2021)</text>
<text x="430" y="142.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">W = W0 + BA, rank 4</text>
<text x="430" y="170.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">merge after: zero inference cost</text>
<rect x="60" y="214" width="220" height="88" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="258.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">QLoRA (2023)</text>
<text x="430" y="246.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">NF4 base, BF16 adapters</text>
<text x="430" y="274.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">65B-class on one GPU</text>
<rect x="60" y="318" width="220" height="88" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="362.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">DoRA (2024)</text>
<text x="430" y="350.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">magnitude + direction</text>
<text x="430" y="378.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">closer to full fine-tuning</text>
<rect x="60" y="422" width="220" height="88" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="466.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">rsLoRA</text>
<text x="430" y="454.0" text-anchor="start" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">scale by 1/sqrt(r)</text>
<text x="430" y="482.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">stable at rank &gt; 16</text>
<rect x="60" y="540" width="840" height="90" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="575.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Rank is the budget knob: r = 4-16 for instruction tuning, higher for harder tasks.</text>
<text x="480" y="605.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Pick by budget: QLoRA for one GPU, LoRA for a few, DoRA when quality matters most.</text>
<text x="944" y="666" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>