<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l01-onehot" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l01-onehot" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">One-hot vs embedding: sparse index to dense meaning</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 1. One-hot carries no meaning. Embeddings learn it.</text>
<rect x="60" y="120" width="400" height="220" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="150.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">one-hot: "cat"</text>
<text x="260" y="190.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">50,000 dims, one 1</text>
<text x="260" y="230.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#1B2838" dominant-baseline="middle">[0, 0, ..., 1, ..., 0]</text>
<text x="260" y="270.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">cat vs dog: distance = sqrt(2)</text>
<text x="260" y="305.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#C46B2C" dominant-baseline="middle">every word equally far</text>
<rect x="500" y="120" width="400" height="220" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="150.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">embedding: "cat"</text>
<text x="700" y="190.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">a few hundred dims, all dense</text>
<text x="700" y="230.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" font-weight="450" fill="#1B2838" dominant-baseline="middle">[0.2, -1.1, ..., 0.7]</text>
<text x="700" y="270.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">cat near dog, far from car</text>
<text x="700" y="305.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">distance carries meaning</text>
<line x1="460" y1="230" x2="500" y2="230" stroke="#1F7A72" stroke-width="1.5" marker-end="url(#aht-l01-onehot)"/>
<rect x="453.1" y="188.9" width="53.7" height="22.1" rx="8" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/>
<text x="480" y="200.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="500" fill="#5C6B7A" dominant-baseline="middle">learn</text>
<rect x="60" y="380" width="840" height="160" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="418.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">One-hot is an index. The embedding matrix turns indices into geometry.</text>
<text x="480" y="458.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Geometry is what attention compares: similar vectors score high.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>