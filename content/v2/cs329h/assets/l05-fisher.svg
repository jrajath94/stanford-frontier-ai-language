nt-weight="600" fill="#1B2838" text-anchor="start">worked</text><text x="904" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Uhat = 1.0</text><text x="904" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">hard: I=0.197</text><text x="904" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">matched: I=0.250</text><text x="904" y="300" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">easy: I=0.105</text><text x="60" y="500" font-size="15" font-weight="450" fill="#5C6B7A" text-anchor="start">I_j(U) = p(1-p). Too easy or too hard teaches little. This is computerized adaptive testing.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 2.17 worked example, original plate. Shell 3: the peak.</text></svg>