<text x="320" y="426.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">ReLU -&gt; GELU and friends</text>
<text x="320" y="454.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">new ones still appear</text>
