<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<defs><marker id="ah-l07-ann" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-ann" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="680" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">ANN indexes: IVF clusters, HNSW graphs, PQ compresses</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. Linear scan over 1M chunks is 1.5B multiply-adds per query.</text>
<rect x="60" y="110" width="200" height="94" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="157.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">IVF</text>
<text x="400" y="142.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">cluster into ~1K cells, search ~10</text>
<text x="400" y="172.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">100x fewer compares; misses borders</text>
<rect x="60" y="220" width="200" height="94" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="267.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">HNSW</text>
<text x="400" y="252.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">graph, greedy walk coarse-to-fine</text>
<text x="400" y="282.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">default: fast, accurate, RAM-hungry</text>
<rect x="60" y="330" width="200" height="94" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="160" y="377.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">PQ</text>
<text x="400" y="362.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">compress vectors to ~100 bytes</text>
<text x="400" y="392.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">15x less memory, approximate</text>
<rect x="60" y="460" width="840" height="150" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="500.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="600" fill="#1B2838" dominant-baseline="middle">Decision rule: HNSW under ~100M vectors when RAM allows, IVF-PQ past that.</text>
<text x="480" y="540.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Tune recall on your own labels: nprobe (IVF) or ef (HNSW) trades latency for recall.</text>
<text x="480" y="575.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">50M chunks x 1500 dims: 300 GB raw, ~5 GB with PQ. That is the whole argument.</text>
<text x="944" y="666" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>