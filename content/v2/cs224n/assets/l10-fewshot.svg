<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Few-shot prompting</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Few-shot: examples in, no gradient updates</text><rect x="60" y="90" width="640" height="80" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="380" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">thanks -&gt; merci</text><text x="380" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">hello -&gt; bonjour</text><text x="380" y="130" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal"></text><line x1="380" y1="170" x2="380" y2="205" stroke="#2B2B2B" stroke-width="2"/><polygon points="380,205 371,201 371,209" fill="#2B2B2B"/><rect x="230" y="205" width="300" height="50" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="380" y="236" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">otter -&gt; ?</text><text x="60" y="280" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Zero-shot TL;DR: models summarize without training for it.</text></svg>