<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<defs><marker id="ah-l02-bert-family" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l02-bert-family" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="680" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">The BERT family: what each variant changed</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 2. One mechanism per variant, not a catalog.</text>
<rect x="60" y="110" width="220" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">BERT (2018)</text>
<text x="420" y="140.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">MLM 15% + NSP 50/50</text>
<text x="420" y="168.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">bidirectional encoder baseline</text>
<rect x="60" y="210" width="220" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="252.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">RoBERTa (2019)</text>
<text x="420" y="240.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">drop NSP, more data, longer</text>
<text x="420" y="268.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">NSP was the weak link</text>
<rect x="60" y="310" width="220" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="352.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">DistilBERT (2019)</text>
<text x="420" y="340.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">KL-distill to 6 layers</text>
<text x="420" y="368.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">60% faster, 97% of the quality</text>
<rect x="60" y="410" width="220" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="452.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">ALBERT (2019)</text>
<text x="420" y="440.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">share params across layers</text>
<text x="420" y="468.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">same depth, far fewer params</text>
<rect x="60" y="510" width="220" height="84" rx="12" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="552.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="600" fill="#1B2838" dominant-baseline="middle">T5 (2019)</text>
<text x="420" y="540.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">span corruption + sentinels</text>
<text x="420" y="568.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="13" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">everything is text-to-text</text>
<rect x="60" y="620" width="840" height="44" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="642.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">Interview line: name the one change and the one reason.</text>
<text x="944" y="666" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>