<text x="480" y="416.0" text-anchor="middle" font-family="'Source Serif 4',Newsreader,serif" font-size="24" font-weight="600" fill="#1B2838" dominant-baseline="middle">A_i = (r_i - mean(r)) / std(r)</text>
