<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<defs><marker id="ah-l04-lora" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l04-lora" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">LoRA: freeze the giant, train the delta</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 4. W = W0 + BA. QLoRA: NF4 + double quantization, ~16x VRAM cut.</text>
<rect x="60" y="140" width="240" height="140" rx="8" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="180" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">W0</text>
<text x="180" y="216.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">frozen</text>
<text x="340" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="28" font-weight="600" fill="#1B2838" dominant-baseline="middle">+</text>
<rect x="380" y="140" width="180" height="140" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="470" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">B x A</text>
<text x="470" y="216.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1F7A72" dominant-baseline="middle">rank r ~ 4</text>
<text x="610" y="210.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="28" font-weight="600" fill="#1B2838" dominant-baseline="middle">=</text>
<rect x="650" y="140" width="240" height="140" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="770" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="22" font-weight="600" fill="#1B2838" dominant-baseline="middle">W</text>
<text x="770" y="216.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">adapted</text>
<rect x="60" y="340" width="840" height="190" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="378.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Practice: 10x the learning rate vs full fine-tuning. FFN blocks benefit most.</text>
<text x="480" y="420.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">QLoRA: 4-bit NormalFloat weights, BF16 adapters, double quantization.</text>
<text x="480" y="460.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">~16x less VRAM. Fine-tune a 65B-class model on one GPU.</text>
<text x="944" y="586" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
