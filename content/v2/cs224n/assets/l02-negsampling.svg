<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Negative sampling cost comparison</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Negative sampling: skip the full softmax</text><rect x="60" y="80" width="300" height="130" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="210" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#D96830" text-anchor="middle" font-weight="bold">Naive softmax</text><text x="210" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">400,000 vocab words</text><text x="210" y="164" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">x 100/300-dim dots</text><text x="210" y="190" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">per prediction</text><rect x="400" y="80" width="300" height="130" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="550" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="16" fill="#1F7A6D" text-anchor="middle" font-weight="bold">Negative sampling</text><text x="550" y="140" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">1 real pair + k negatives</text><text x="550" y="164" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle" font-weight="normal">train k+1 logistic regressions</text><text x="550" y="190" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">sigmoid, cheap</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Sign symmetry trick: same math, flipped signs, no full sum.</text><text x="60" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">GloVe 100-dim vectors used for the demo (bread vs croissant).</text></svg>