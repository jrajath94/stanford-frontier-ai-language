<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"><title>A layer is an affine map plus an activation</title><rect width="760" height="280" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">One layer: affine map, then activation</text><rect x="60" y="100" width="200" height="80" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="160" y="132" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#1F7A6D" text-anchor="middle" font-weight="bold">z = Wx + b</text><text x="160" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">affine</text><line x1="260" y1="140" x2="310" y2="140" stroke="#2B2B2B" stroke-width="2"/><polygon points="310,140 301,136 301,144" fill="#2B2B2B"/><rect x="310" y="100" width="200" height="80" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="410" y="132" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="18" fill="#D96830" text-anchor="middle" font-weight="bold">h = sigma(z)</text><text x="410" y="158" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">activation</text><line x1="510" y1="140" x2="560" y2="140" stroke="#2B2B2B" stroke-width="2"/><polygon points="560,140 551,136 551,144" fill="#2B2B2B"/><text x="560" y="148" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">output</text><text x="60" y="225" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Stack layers: the output of one is the input of the next.</text><text x="60" y="251" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The whole network is one composed function.</text></svg>