<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="600" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The four-stage fairness pipeline</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Every stage embeds a value choice.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="250" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="40" y="170" width="8" height="210" rx="4" fill="#1E4D8C"/><text x="64" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">E: elicitation</text><text x="64" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">who gets asked</text><text x="64" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">Fisher info is efficient,</text><text x="64" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">may skip minorities</text><rect x="310" y="170" width="250" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="310" y="170" width="8" height="210" rx="4" fill="#1F7A72"/><text x="334" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">L: learning</text><text x="334" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">what counts as valid</text><text x="334" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">BT assumes IIA,</text><text x="334" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">ignores context</text><rect x="580" y="170" width="250" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="580" y="170" width="8" height="210" rx="4" fill="#C46B2C"/><text x="604" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">A: aggregation</text><text x="604" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">whose prefs weigh more</text><text x="604" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">majority rules,</text><text x="604" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">minorities lose</text><rect x="850" y="170" width="250" height="210" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="850" y="170" width="8" height="210" rx="4" fill="#5C6B7A"/><text x="874" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">D: decision</text><text x="874" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">defer or override</text><text x="874" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">trust the model,</text><text x="874" y="276" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">edge cases harmed</text><rect x="40" y="420" width="1040" height="100" rx="8" fill="#F9E9E4" stroke="#D9D3C7" stroke-width="1.5"/><text x="64" y="454" font-size="15" font-weight="600" fill="#8A2A1B" text-anchor="start">Compounding: 10% sampling bias at E can become a 40% performance gap after one feedback loop.</text><text x="64" y="484" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Fix: stratify E, constrain L, audit D.</text><text x="40" y="572" font-size="14" fill="#5C6B7A">Source: textbook ch 4.2-4.3 AI review assistant, original plate. Shell 4: the loop.</text></svg>