<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="640" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">The preference pair</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Chosen, rejected, and the update.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="1000" height="90" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="160" width="8" height="90" rx="4" fill="#1E4D8C"/><text x="84" y="192" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">prompt x</text><text x="84" y="218" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">one prompt, two candidate responses</text><rect x="60" y="290" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="290" width="8" height="200" rx="4" fill="#1F7A72"/><text x="84" y="322" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">y_w: chosen response</text><text x="84" y="348" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">human preferred this one</text><text x="84" y="372" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">annotator: A is better</text><text x="84" y="396" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">reward r(x, y_w) goes UP</text><rect x="600" y="290" width="460" height="200" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="600" y="290" width="8" height="200" rx="4" fill="#C46B2C"/><text x="624" y="322" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">y_l: rejected response</text><text x="624" y="348" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">human rejected this one</text><text x="624" y="372" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">annotator: B is worse</text><text x="624" y="396" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">reward r(x, y_l) goes DOWN</text><rect x="230" y="380" width="120" height="32" rx="999" fill="#1F7A72" stroke="#D9D3C7" stroke-width="1.5"/><text x="290.0" y="401.0" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">chosen</text><rect x="770" y="380" width="120" height="32" rx="999" fill="#C46B2C" stroke="#D9D3C7" stroke-width="1.5"/><text x="830.0" y="401.0" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">rejected</text><rect x="60" y="520" width="1000" height="60" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="556" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">The update: widen the gap r(x, y_w) - r(x, y_l). This single object trains reward models, DPO, and RLHF.</text><text x="40" y="612" font-size="14" fill="#5C6B7A">Source: textbook ch 1.2/2.9, original plate. Shell 5: reused by CS329Z, CS329A.</text></svg>