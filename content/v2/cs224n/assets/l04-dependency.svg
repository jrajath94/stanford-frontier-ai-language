<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"><title>Dependency arcs for the big cat sat</title><rect width="760" height="280" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Dependency structure: head to dependent arcs</text><rect x="105" y="120" width="90" height="44" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="150" y="149" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">the</text><rect x="245" y="120" width="90" height="44" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="290" y="149" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">big</text><rect x="385" y="120" width="90" height="44" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="430" y="149" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">cat</text><rect x="525" y="120" width="90" height="44" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2" rx="10"/><text x="570" y="149" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">sat</text><path d="M150,110 Q290.0,30 430,110" stroke="#1F7A6D" stroke-width="2.5" fill="none"/><polygon points="430,110 421,104 425,114" fill="#1F7A6D"/><text x="290.0" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">det</text><path d="M290,110 Q360.0,30 430,110" stroke="#1F7A6D" stroke-width="2.5" fill="none"/><polygon points="430,110 421,104 425,114" fill="#1F7A6D"/><text x="360.0" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">amod</text><path d="M430,110 Q500.0,30 570,110" stroke="#1F7A6D" stroke-width="2.5" fill="none"/><polygon points="570,110 561,104 565,114" fill="#1F7A6D"/><text x="500.0" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="12" fill="#5A5A52" text-anchor="middle" font-weight="normal">nsubj</text><text x="60" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Each word has one head. Arcs carry labels: det, amod, nsubj.</text><text x="60" y="246" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">The root &#x27;sat&#x27; has no head: its head is 0.</text></svg>