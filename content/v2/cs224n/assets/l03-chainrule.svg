<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Chain rule on a composed function</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Chain rule: multiply local gradients</text><circle cx="130" cy="130" r="34" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2"/><text x="130" y="139" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">z</text><circle cx="380" cy="130" r="34" fill="#FFFFFF" stroke="#D96830" stroke-width="2"/><text x="380" y="139" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">h</text><circle cx="630" cy="130" r="34" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2"/><text x="630" y="139" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">s</text><line x1="164" y1="130" x2="346" y2="130" stroke="#2B2B2B" stroke-width="2"/><polygon points="346,130 337,126 337,134" fill="#2B2B2B"/><line x1="414" y1="130" x2="596" y2="130" stroke="#2B2B2B" stroke-width="2"/><polygon points="596,130 587,126 587,134" fill="#2B2B2B"/><text x="255" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#D96830" text-anchor="middle" font-weight="bold">dh/dz</text><text x="505" y="112" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">ds/dh</text><text x="380" y="220" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="22" fill="#1F7A6D" text-anchor="middle" font-weight="bold">ds/dz = ds/dh x dh/dz</text><text x="380" y="254" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="14" fill="#5A5A52" text-anchor="middle" font-weight="normal">The matrix version: Jacobians multiply</text><text x="150" y="292" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Backprop is this idea, applied efficiently through the graph.</text></svg>