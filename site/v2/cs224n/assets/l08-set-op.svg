<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Self-attention is a set operation</title><rect width="760" height="300" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Self-attention: a SET operation</text><rect x="60" y="90" width="300" height="70" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="2" rx="10"/><text x="210" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">&quot;Zuko made his uncle&quot;</text><text x="210" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">order ignored</text><rect x="400" y="90" width="300" height="70" fill="#FFFFFF" stroke="#D96830" stroke-width="2" rx="10"/><text x="550" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="middle" font-weight="bold">&quot;his uncle made Zuko&quot;</text><text x="550" y="144" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">same set, same output</text><text x="60" y="210" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">Without position info, self-attention cannot tell them apart.</text><text x="60" y="236" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">That is why positional encoding is required.</text></svg>