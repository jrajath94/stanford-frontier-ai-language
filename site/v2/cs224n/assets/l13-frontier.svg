<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img"><title>Frontier: inner speech and avatars</title><rect width="760" height="320" fill="#F7F4EE" rx="14"/><text x="380" y="40" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle" font-weight="bold">Frontier: decode inner speech</text><rect x="60" y="90" width="300" height="110" fill="#FFFFFF" stroke="#7C5CBF" stroke-width="2" rx="10"/><text x="210" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#7C5CBF" text-anchor="middle" font-weight="bold">inner speech</text><text x="210" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">thought without</text><text x="210" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">attempted movement</text><rect x="400" y="90" width="300" height="110" fill="#FFFFFF" stroke="#2E6BE6" stroke-width="2" rx="10"/><text x="550" y="118" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2E6BE6" text-anchor="middle" font-weight="bold">UCSF multimodal</text><text x="550" y="146" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#2B2B2B" text-anchor="middle" font-weight="normal">phonemes + articulation</text><text x="550" y="170" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="13" fill="#5A5A52" text-anchor="middle" font-weight="normal">drive a 3D avatar</text><text x="60" y="250" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="normal">From attempted speech to imagined speech.</text><text x="60" y="276" font-family="'Inter','Avenir Next','Segoe UI',Verdana,sans-serif" font-si