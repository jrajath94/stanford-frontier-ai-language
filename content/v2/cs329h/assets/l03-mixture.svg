<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', system-ui, sans-serif"><rect width="1120" height="580" fill="#F7F4EE"/><text x="40" y="52" font-size="32" font-weight="600" fill="#1B2838">Heterogeneity breaks IIA</text><text x="40" y="82" font-size="17" fill="#5C6B7A">Two IIA groups mix into a non-IIA population.</text><line x1="40" y1="100" x2="1080" y2="100" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="440" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="60" y="170" width="8" height="190" rx="4" fill="#1F7A72"/><text x="84" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">group 1 (50%)</text><text x="84" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">A: 1.0  B: 2.0  C: 3.0</text><text x="84" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">loves C</text><rect x="620" y="170" width="440" height="190" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="1.5"/><rect x="620" y="170" width="8" height="190" rx="4" fill="#C46B2C"/><text x="644" y="202" font-size="16" font-weight="600" fill="#1B2838" text-anchor="start">group 2 (50%)</text><text x="644" y="228" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">A: 3.0  B: 2.0  C: 1.0</text><text x="644" y="252" font-size="14" font-weight="450" fill="#5C6B7A" text-anchor="start">loves A</text><line x1="500" y1="265" x2="620" y2="265" stroke="#1E4D8C" stroke-width="1.5"/><path d="M620,265 l-11,-4.5 M620,265 l-11,4.5" stroke="#1E4D8C" stroke-width="1.5" fill="none"/><rect x="488.0" y="252.0" width="144" height="24" rx="12" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1"/><text x="560.0" y="270.0" font-size="12.5" font-weight="500" fill="#1E4D8C" text-anchor="middle">mix</text><rect x="60" y="400" width="1000" height="100" rx="8" fill="#E7F1F8" stroke="#D9D3C7" stroke-width="1.5"/><text x="84" y="432" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Each group satisfies IIA. The 50/50 mixture does not: removing C moves the A/B ratio.</text><text x="84" y="460" font-size="15" font-weight="450" fill="#1B2838" text-anchor="start">Fix: model the groups (mixture / random-coefficient logit) or accept the compromise.</text><text x="40" y="552" font-size="14" fill="#5C6B7A">Source: textbook ch 1.8 mixture code, original plate. Shell 4: the mixture.</text></svg>