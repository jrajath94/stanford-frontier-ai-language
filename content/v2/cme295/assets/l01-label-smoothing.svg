<rect x="0" y="0" width="960" height="520" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Label smoothing: fight overconfidence</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 1 slides. 2015 vision idea. Prevents overfitting, improves BLEU.</text>
<rect x="80" y="140" width="360" height="240" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="260" y="176.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Hard targets</text>
<text x="260" y="206.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">correct word: 1.0</text>
<text x="260" y="226.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">everything else: 0.0</text>
<text x="260" y="290.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#C46B2C" dominant-baseline="middle">Model becomes</text>
<text x="260" y="310.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#C46B2C" dominant-baseline="middle">overconfident.</text>
<rect x="520" y="140" width="360" height="240" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="700" y="176.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="18" font-weight="600" fill="#1B2838" dominant-baseline="middle">Smoothed targets</text>
<text x="700" y="206.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">correct word: 1 - eps</text>
<text x="700" y="226.0" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="15" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">everything else: eps / (V-1)</text>
<text x="700" y="290.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1F7A72" dominant-baseline="middle">Noise in true labels.</text>
<text x="700" y="310.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1F7A72" dominant-baseline="middle">Better accuracy and BLEU.</text>
