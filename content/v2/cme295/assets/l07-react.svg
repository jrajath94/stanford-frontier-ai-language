<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img">
<defs><marker id="ah-l07-react" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l07-react" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="700" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">ReAct: observe, plan, act, repeat</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 7. Agents = tool loops with reasoning. Thermostat example.</text>
<rect x="60" y="150" width="260" height="56" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="190.0" y="178.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#1B2838" dominant-baseline="middle">"My teddy bear is cold."</text>
<line x1="320" y1="178" x2="380" y2="178" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-react)"/>
<rect x="380" y="120" width="96" height="116" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="428" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#1B2838" dominant-baseline="middle">OBSERVE</text>
<text x="428" y="189.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">cold -&gt; temperature?</text>
<text x="428" y="202.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">unknown, must measure</text>
<line x1="476" y1="178" x2="488" y2="178" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-react)"/>
<rect x="488" y="120" width="96" height="116" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="536" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#1B2838" dominant-baseline="middle">PLAN</text>
<text x="536" y="189.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">determine room temp</text>
<text x="536" y="202.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">tool: get_temp()</text>
<line x1="584" y1="178" x2="596" y2="178" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-react)"/>
<rect x="596" y="120" width="96" height="116" rx="8" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="644" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#1B2838" dominant-baseline="middle">ACT</text>
<text x="644" y="189.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">temp = 65F</text>
<text x="644" y="202.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">colder than expected</text>
<line x1="692" y1="178" x2="704" y2="178" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-react)"/>
<rect x="704" y="120" width="96" height="116" rx="8" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="752" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#1B2838" dominant-baseline="middle">PLAN</text>
<text x="752" y="189.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">increase by 5 degrees</text>
<text x="752" y="202.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">tool: set_temp()</text>
<line x1="800" y1="178" x2="812" y2="178" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l07-react)"/>
<rect x="812" y="120" width="96" height="116" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="860" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#1B2838" dominant-baseline="middle">OBSERVE</text>
<text x="860" y="189.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">temp correct</text>
<text x="860" y="202.5" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="10" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">-&gt; exit loop</text>
<rect x="60" y="330" width="840" height="120" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="368.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Each loop: check the goal. Reached it? Answer. Not yet? Reason and act again.</text>
<text x="480" y="406.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">A2A protocol (Google): standardize agent-to-agent skills, status, cancel.</text>
<rect x="60" y="500" width="840" height="140" rx="8" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="536.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#C46B2C" dominant-baseline="middle">7 failure modes: punt, tool hallucination, wrong tool, wrong args, bad output, no output, bad synthesis.</text>
<text x="480" y="574.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Safety: data exfiltration via tools. Train harmlessness. Add inference classifiers.</text>
<text x="944" y="686" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>