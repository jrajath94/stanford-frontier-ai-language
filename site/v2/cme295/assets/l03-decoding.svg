<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l03-decoding" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l03-decoding" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Decoding: from probabilities to tokens</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 3. Greedy, beam, sampling, top-K, top-P.</text>
<rect x="60" y="110" width="220" height="84" rx="12" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="152.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Greedy</text>
<rect x="296" y="110" width="604" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="330" y="140.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">take argmax each step</text>
<text x="330" y="170.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Fast. Can loop or go bland.</text>
<rect x="60" y="210" width="220" height="84" rx="12" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="252.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Beam search</text>
<rect x="296" y="210" width="604" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="330" y="240.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">keep B hypotheses, sum log-probs + length norm</text>
<text x="330" y="270.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Better. Costs B times more.</text>
<rect x="60" y="310" width="220" height="84" rx="12" fill="#C46B2C" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="352.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Sampling</text>
<rect x="296" y="310" width="604" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="330" y="340.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">draw from the distribution</text>
<text x="330" y="370.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Diverse. Can surprise you.</text>
<rect x="60" y="410" width="220" height="84" rx="12" fill="#1F7A72" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="452.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Top-K</text>
<rect x="296" y="410" width="604" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="330" y="440.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">sample from the K best tokens</text>
<text x="330" y="470.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Cuts the weird tail.</text>
<rect x="60" y="510" width="220" height="84" rx="12" fill="#1E4D8C" stroke="#1B2838" stroke-width="1.5"/>
<text x="170" y="552.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" dominant-baseline="middle">Top-P (nucleus)</text>
<rect x="296" y="510" width="604" height="84" rx="12" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/>
<text x="330" y="540.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">sample from smallest set with mass P</text>
<text x="330" y="570.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Adapts to sharp or flat.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>