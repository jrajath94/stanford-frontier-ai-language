<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
<defs><marker id="ah-l08-biases" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l08-biases" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="640" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Judge biases: three to watch</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 8. None of these lists is exhaustive.</text>
<rect x="60" y="110" width="260" height="134" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="177.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#C46B2C" dominant-baseline="middle">Position bias</text>
<text x="360" y="160.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">symptom: prefers whichever answer came first</text>
<text x="360" y="194.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#1F7A72" dominant-baseline="middle">fix: ask both orders, majority vote</text>
<rect x="60" y="260" width="260" height="134" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="327.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#C46B2C" dominant-baseline="middle">Verbosity bias</text>
<text x="360" y="310.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">symptom: prefers longer answers</text>
<text x="360" y="344.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#1F7A72" dominant-baseline="middle">fix: guidelines, examples, length penalty</text>
<rect x="60" y="410" width="260" height="134" rx="12" fill="#F3D4D8" stroke="#1B2838" stroke-width="1.5"/>
<text x="190" y="477.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#C46B2C" dominant-baseline="middle">Self-enhancement</text>
<text x="360" y="460.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">symptom: prefers its own outputs</text>
<text x="360" y="494.0" text-anchor="start" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#1F7A72" dominant-baseline="middle">fix: different judge, ideally bigger</text>
<rect x="60" y="540" width="840" height="56" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="568.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Best practice: low temperature (0.1-0.2) for reproducibility. Calibrate against human ratings.</text>
<text x="944" y="626" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>