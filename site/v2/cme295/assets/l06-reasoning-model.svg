<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
<defs><marker id="ah-l06-reasoning-model" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B2838"/></marker><marker id="aht-l06-reasoning-model" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F7A72"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
<text x="24" y="44" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="27" font-weight="600" fill="#1B2838">Reasoning model: think, then answer</text>
<text x="24" y="68" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="450" fill="#5C6B7A">From CME295 Lecture 6. Chains are usually hidden. You pay for them as output tokens.</text>
<rect x="60" y="200" width="200" height="56" rx="999" fill="#E6E2DA" stroke="#1B2838" stroke-width="1.5"/>
<text x="160.0" y="228.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">prompt</text>
<line x1="260" y1="228" x2="320" y2="228" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l06-reasoning-model)"/>
<rect x="320" y="140" width="300" height="176" rx="12" fill="#F4E6D4" stroke="#1B2838" stroke-width="1.5"/>
<text x="470" y="176.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="17" font-weight="600" fill="#1B2838" dominant-baseline="middle">reasoning chain</text>
<text x="470" y="207.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">hidden from user</text>
<text x="470" y="225.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">thought summary shown</text>
<text x="470" y="280.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="500" fill="#C46B2C" dominant-baseline="middle">billed as output</text>
<line x1="620" y1="228" x2="680" y2="228" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah-l06-reasoning-model)"/>
<rect x="680" y="200" width="220" height="56" rx="999" fill="#E7F4EF" stroke="#1B2838" stroke-width="1.5"/>
<text x="790.0" y="228.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="16" font-weight="500" fill="#1B2838" dominant-baseline="middle">final answer</text>
<rect x="60" y="380" width="840" height="170" rx="8" fill="#E7F1F8" stroke="#1B2838" stroke-width="1.5"/>
<text x="480" y="416.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="15" font-weight="500" fill="#1B2838" dominant-baseline="middle">Timeline: o1 preview Sep 2024 -&gt; Gemini 2.0 Flash Thinking Dec 2024 -&gt; DeepSeek R1 Jan 2025.</text>
<text x="480" y="456.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Intuition: hard problems split into tractable subproblems. More tokens = more compute.</text>
<text x="480" y="494.0" text-anchor="middle" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="14" font-weight="450" fill="#5C6B7A" dominant-baseline="middle">Summaries, not raw chains: raw chains confuse users, run long, and train competitors.</text>
<text x="944" y="606" text-anchor="end" font-family="Inter,'Source Sans 3','IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#5C6B7A">Original figure · CME295</text>
</svg>